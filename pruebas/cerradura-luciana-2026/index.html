<script>
(() => {
 const app=document.getElementById("app");
 const detailOverlay=document.getElementById("demoOverlay");
 const detailTitle=document.getElementById("demoTitle");
 const detailBody=document.getElementById("demoBody");
 const detailClose=document.getElementById("demoClose");

 const auraLocationUrl="https://maps.app.goo.gl/LTwAFXYZmcoGsfCq5";
 let auraLocationSeq=0;
 function auraCoords(input){
  const s=String(input||"").replace(/&amp;/g,"&");
  const patterns=[
   /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/i,
   /[?&#](?:q|query|destination|center|ll)=\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/i,
   /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)(?:,|\/|$)/i,
   /(?:geo:|^|\s)(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)(?:\s|$)/i
  ];
  for(const pattern of patterns){
   const m=s.match(pattern);if(!m)continue;const lat=+m[1],lng=+m[2];
   if(Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180)return[lat,lng];
  }
  return null;
 }
 async function auraResolveMap(){
  // Pin exacto extraído de la URL oficial compartida (Salón Progreso, Juchitlán).
  const direct=auraCoords("20.0847711,-104.0985053");if(direct)return direct;
  const services=[
   {url:"https://api.domainee.dev/v1/tools/redirect-checker?url="+encodeURIComponent(auraLocationUrl),options:{cache:"no-store"},take:j=>j?.data?.finalUrl||j?.data?.final_url||""},
   {url:"https://www.redirectcheck.org/api/check",options:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:auraLocationUrl,method:"GET",followMetaRefresh:true}),cache:"no-store"},take:j=>j?.final_result?.final_url||j?.finalResult?.finalUrl||j?.data?.finalUrl||""}
  ];
  for(const s of services){
   const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),4500);
   try{const res=await fetch(s.url,{...s.options,signal:ctrl.signal});if(!res.ok)continue;const coords=auraCoords(s.take(await res.json()));if(coords)return coords;}catch(e){}finally{clearTimeout(timeout)}
  }
  return null;
 }
 function auraBindMap(){
  const btn=detailBody.querySelector("#auraMapToggle"),panel=detailBody.querySelector("#auraMapPanel"),frame=detailBody.querySelector("#auraMapFrame"),status=detailBody.querySelector("#auraMapStatus");
  if(!btn||!panel||!frame)return;
  btn.addEventListener("click",async()=>{
   const expanded=panel.hidden;panel.hidden=!expanded;
   btn.setAttribute("aria-expanded",String(expanded));
   btn.querySelector("span:first-child").textContent=expanded?"Ocultar mapa":"Ver mapa";
   if(!expanded||frame.querySelector("iframe"))return;
   if(status)status.textContent="Buscando el pin exacto del enlace de Google Maps…";
   const seq=++auraLocationSeq;
   const coords=await auraResolveMap();
   if(seq!==auraLocationSeq||!detailBody.contains(frame))return;
   if(!coords){if(status)status.textContent="Para ver el punto exacto, abre la ubicación en Google Maps.";return;}
   const iframe=document.createElement("iframe");
   iframe.loading="lazy";iframe.title="Mapa de la ubicación compartida";iframe.referrerPolicy="no-referrer-when-downgrade";
   iframe.setAttribute("allowfullscreen","");
   iframe.src="https://www.google.com/maps?q="+encodeURIComponent(coords.join(","))+"&hl=es&t=m&z=16&output=embed";
   frame.replaceChildren(iframe);
  });
 }
 let previousFocus=null;
 let countdownInterval=null;
 const countdownTarget=new Date("2026-11-13T15:00:00-06:00").getTime();
 function stopCountdown(){if(countdownInterval!==null){clearInterval(countdownInterval);countdownInterval=null;}}
 function updateCountdown(){
  const timer=detailBody.querySelector("#dateCountdown");if(!timer)return;
  const remaining=Math.max(0,countdownTarget-Date.now());
  const values={days:Math.floor(remaining/86400000),hours:Math.floor(remaining/3600000)%24,minutes:Math.floor(remaining/60000)%60,seconds:Math.floor(remaining/1000)%60};
  for(const [key,value] of Object.entries(values)){const node=timer.querySelector('[data-count="'+key+'"]');if(node)node.textContent=String(value).padStart(2,"0");}
  const grid=timer.querySelector(".countdown-grid"),done=timer.querySelector("#countdownFinished");
  if(grid)grid.hidden=remaining===0;if(done)done.hidden=remaining>0;
 }
 const details={
  fecha:{title:"Fecha y hora",content:"<div class=\"date-experience\">\n <div class=\"date-month\"><span class=\"date-rule\"></span><span>Noviembre 2026</span><span class=\"date-rule\"></span></div>\n <div class=\"date-calendar\" aria-label=\"Calendario noviembre 2026; el viernes 13 está señalado con un corazón\">\n  <div class=\"date-weekdays\"><span class=\"date-day-name\" aria-label=\"Domingo\">D</span><span class=\"date-day-name\" aria-label=\"Lunes\">L</span><span class=\"date-day-name\" aria-label=\"Martes\">M</span><span class=\"date-day-name\" aria-label=\"Miércoles\">M</span><span class=\"date-day-name\" aria-label=\"Jueves\">J</span><span class=\"date-day-name\" aria-label=\"Viernes\">V</span><span class=\"date-day-name\" aria-label=\"Sábado\">S</span></div><div class=\"date-grid\"><span class=\"date-day\">1</span><span class=\"date-day\">2</span><span class=\"date-day\">3</span><span class=\"date-day\">4</span><span class=\"date-day\">5</span><span class=\"date-day\">6</span><span class=\"date-day\">7</span><span class=\"date-day\">8</span><span class=\"date-day\">9</span><span class=\"date-day\">10</span><span class=\"date-day\">11</span><span class=\"date-day\">12</span><span class=\"date-day date-special\" aria-label=\"Viernes 13 de noviembre, día del evento\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A5.5 5.5 0 0 1 7.5 3c1.74 0 3.41.81 4.5 2.09A5.95 5.95 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z\"/></svg></span><span class=\"date-day\">14</span><span class=\"date-day\">15</span><span class=\"date-day\">16</span><span class=\"date-day\">17</span><span class=\"date-day\">18</span><span class=\"date-day\">19</span><span class=\"date-day\">20</span><span class=\"date-day\">21</span><span class=\"date-day\">22</span><span class=\"date-day\">23</span><span class=\"date-day\">24</span><span class=\"date-day\">25</span><span class=\"date-day\">26</span><span class=\"date-day\">27</span><span class=\"date-day\">28</span><span class=\"date-day\">29</span><span class=\"date-day\">30</span><span class=\"date-day is-empty\" aria-hidden=\"true\"></span><span class=\"date-day is-empty\" aria-hidden=\"true\"></span><span class=\"date-day is-empty\" aria-hidden=\"true\"></span><span class=\"date-day is-empty\" aria-hidden=\"true\"></span><span class=\"date-day is-empty\" aria-hidden=\"true\"></span></div>\n </div>\n <div class=\"date-event-info\"><strong>Viernes 13 de noviembre</strong><span>3:00 p. m.</span></div>\n <div class=\"date-countdown\" id=\"dateCountdown\" aria-label=\"Cuenta regresiva para el viernes 13 de noviembre de 2026 a las 3 de la tarde\">\n  <p class=\"countdown-heading\">Faltan para nuestro día especial</p><div class=\"countdown-grid\"><div class=\"countdown-unit\"><strong data-count=\"days\">00</strong><span>Días</span></div><div class=\"countdown-unit\"><strong data-count=\"hours\">00</strong><span>Horas</span></div><div class=\"countdown-unit\"><strong data-count=\"minutes\">00</strong><span>Minutos</span></div><div class=\"countdown-unit\"><strong data-count=\"seconds\">00</strong><span>Segundos</span></div></div>\n  <p class=\"countdown-finished\" id=\"countdownFinished\" hidden>¡Llegó el gran día!</p>\n </div>\n</div>"},
  ubicacion:{title:"Ubicación",content:"<div class=\"aura-location\">\n <div class=\"aura-location-heading\"><span class=\"aura-location-kicker\">Nos vemos aquí</span><span class=\"aura-location-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.4\"/></svg></span><strong>Salón Progreso</strong><span class=\"aura-location-address\">Av. Juan Gil Preciado · Centro, Juchitlán, Jal.</span></div>\n <button class=\"aura-map-toggle\" id=\"auraMapToggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"auraMapPanel\"><span>Ver mapa</span><span class=\"aura-map-toggle-sign\" aria-hidden=\"true\">+</span></button>\n <div class=\"aura-map-panel\" id=\"auraMapPanel\" hidden><div class=\"aura-map-frame\" id=\"auraMapFrame\"><div class=\"aura-map-placeholder\" id=\"auraMapPlaceholder\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.4\"/></svg><span id=\"auraMapStatus\">Preparando el mapa de la ubicación…</span></div></div></div>\n <a class=\"aura-map-link\" href=\"https://maps.app.goo.gl/LTwAFXYZmcoGsfCq5\" target=\"_blank\" rel=\"noopener noreferrer\">Abrir ubicación en Google Maps <span aria-hidden=\"true\">↗</span></a>\n</div>"},
  galeria:{title:"Galería de muestra",content:'<p class="demo-muted">Ejemplo de cómo se vería una galería de imágenes integrada en la invitación.</p><div class="demo-gallery-grid"><img loading="lazy" src="miniatura-whatsapp.jpg" alt="Escena de jardín fantástico"><img loading="lazy" src="portada.jpg" alt="Cerradura de entrada mágica"></div>'},
  confirmar:{title:"Confirmar",content:"<p class=\"detail-strong\">¿Nos acompañas?</p><p>Confirma tu asistencia por WhatsApp.</p><a class=\"demo-cta demo-whatsapp\" href=\"https://wa.me/523322300856?text=%C2%A1Hola!%0A%0ACon%20mucho%20gusto%20confirmo%20mi%20asistencia%20al%20cumplea%C3%B1os%20de%20Mar%C3%ADa%20Luciana.%0A%0AAsistiremos%20___%20personas.%0A%0A%C2%A1Muchas%20gracias%20por%20invitarnos%20a%20compartir%20este%20d%C3%ADa%20tan%20especial!\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Confirmar asistencia por WhatsApp\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M12 .75a11.25 11.25 0 0 0-9.67 17l-1.56 5.5 5.64-1.47A11.25 11.25 0 1 0 12 .75Zm0 20.4a9.12 9.12 0 0 1-4.65-1.26l-.34-.2-3.35.87.9-3.26-.22-.36A9.13 9.13 0 1 1 12 21.15Zm5.02-6.84c-.28-.14-1.67-.83-1.93-.92-.26-.1-.45-.14-.63.14-.19.28-.72.92-.89 1.1-.16.19-.33.21-.61.07-1.36-.68-2.26-1.21-3.17-2.75-.24-.42.23-.39.68-1.29.08-.16.04-.31-.02-.45-.07-.14-.64-1.53-.87-2.09-.23-.56-.47-.48-.64-.49l-.54-.01c-.19 0-.49.07-.75.35-.26.28-.99.97-.99 2.35s1.01 2.72 1.15 2.91c.14.19 1.99 3.04 4.82 4.25 1.79.78 2.5.85 3.4.72.54-.08 1.67-.68 1.9-1.34.24-.66.24-1.22.17-1.34-.07-.12-.26-.19-.54-.33Z\"/></svg><span>Confirmar por WhatsApp</span></a><p class=\"demo-muted\">Invitación de muestra. El mensaje se dirige al número de prueba, no al de la clienta.</p>"}
 };
 function openDemo(kind){
  const d=details[kind];if(!d||!app.classList.contains("is-finished"))return;
  stopCountdown();
  previousFocus=document.activeElement;detailTitle.textContent=d.title;detailBody.innerHTML=d.content;
  detailOverlay.classList.add("is-open");detailOverlay.setAttribute("aria-hidden","false");detailClose.focus();
  if(kind==="ubicacion")auraBindMap();
  if(kind==="fecha"){updateCountdown();countdownInterval=setInterval(updateCountdown,1000);}
 }
 function closeDemo(){
  ++auraLocationSeq;
  stopCountdown();
  detailOverlay.classList.remove("is-open");detailOverlay.setAttribute("aria-hidden","true");
  if(previousFocus && typeof previousFocus.focus==="function")previousFocus.focus();
 }
 document.querySelectorAll(".poster-hotspot").forEach(b=>b.addEventListener("click",()=>openDemo(b.dataset.demo)));
 detailClose.addEventListener("click",closeDemo);
 detailOverlay.addEventListener("click",e=>{if(e.target===detailOverlay)closeDemo();});
 document.addEventListener("keydown",e=>{if(e.key==="Escape" && detailOverlay.classList.contains("is-open"))closeDemo();});

 const video=document.getElementById("film");
 const enter=document.getElementById("enter");
 const replay=document.getElementById("replay");
 const status=document.getElementById("status");
 const music=document.getElementById("music");
 const musicToggle=document.getElementById("musicToggle");
 let musicWanted=false;
 function syncMusicControl(){
  const playing=!music.paused && !music.muted;
  musicToggle.classList.toggle("is-on",playing);
  musicToggle.setAttribute("aria-pressed",String(playing));
  musicToggle.setAttribute("aria-label",playing?"Pausar música":"Reproducir música");
  musicToggle.title=playing?"Pausar música":"Reproducir música";
 }
 function playMusic(){
  musicWanted=true;
  music.muted=false;
  if(!music.paused){syncMusicControl();return;}
  try{
   const pending=music.play();
   if(pending&&typeof pending.catch==="function")pending.catch(()=>syncMusicControl());
  }catch(e){syncMusicControl();}
 }
 music.addEventListener("play",syncMusicControl);
 music.addEventListener("pause",syncMusicControl);
 music.addEventListener("volumechange",syncMusicControl);
 musicToggle.addEventListener("click",()=>{
  if(music.paused||music.muted){playMusic();}
  else{musicWanted=false;music.pause();}
 });
 // En móvil, intentar iniciar el audio al tocar, sin esperar a que se suelte el dedo.
 enter.addEventListener("pointerdown",playMusic,{passive:true});
 enter.addEventListener("touchstart",playMusic,{passive:true});
 // Si iOS interrumpe el audio al empezar el video silenciado, procurar reanudarlo.
 video.addEventListener("playing",()=>{
  if(musicWanted&&music.paused)playMusic();
 });
 let waiting=false;
 const end=()=>{app.classList.remove("is-loading");app.classList.add("is-finished");video.pause();};
 function start(){
  if(waiting)return;
  playMusic(); // Respaldo para clic o teclado, con gesto directo del visitante.
  waiting=true;
  app.classList.remove("is-finished","is-playing");
  app.classList.add("is-loading");
  enter.disabled=true;
  status.textContent="Abriendo la puerta mágica…";
  video.currentTime=0;
  video.muted=true; // Solo el video de transición, sin afectar la música independiente.
  const result=video.play();
  if(result&&typeof result.then==="function"){
   result.then(()=>{app.classList.remove("is-loading");app.classList.add("is-playing");waiting=false;})
   .catch(()=>{waiting=false;enter.disabled=false;app.classList.remove("is-loading");status.textContent="Toca de nuevo para entrar";});
  }else{app.classList.remove("is-loading");app.classList.add("is-playing");waiting=false;}
 }
 enter.addEventListener("click",start);
 replay.addEventListener("click",()=>{
  video.pause();video.currentTime=0;
  app.classList.remove("is-finished","is-playing","is-loading");
  enter.disabled=false;
 });
 video.addEventListener("ended",end);
 video.addEventListener("error",()=>{
  if(app.classList.contains("is-playing")||app.classList.contains("is-loading"))end();
 });
 video.addEventListener("timeupdate",()=>{
  if(Number.isFinite(video.duration)&&video.duration-video.currentTime<.09)end();
 });
 document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&app.classList.contains("is-playing"))video.pause();
  if(!document.hidden&&app.classList.contains("is-playing"))video.play().catch(()=>end());
 });
})();
