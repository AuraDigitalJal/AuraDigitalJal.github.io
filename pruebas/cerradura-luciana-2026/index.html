<style>
:root { color-scheme:light; }
* { box-sizing:border-box; }
html,body { margin:0; width:100%; min-height:100%; background:#f7e4e0; }
body { font-family:Georgia,"Times New Roman",serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
body::before { content:""; position:fixed; inset:-5%; background:url("portada.jpg") center/cover no-repeat; filter:blur(35px) saturate(.7); opacity:.5; }
.app { position:relative; width:100%; height:100vh; height:100dvh; margin:auto; max-width:540px; overflow:hidden; background:#f8e7e6; isolation:isolate; box-shadow:0 12px 50px #4a2d3530; }
.layer { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; user-select:none; -webkit-user-drag:none; }
.cover { opacity:1; transition:opacity .52s ease; }
.film { opacity:0; transition:opacity .52s ease; background:#3b2731; pointer-events:none; }
.content { opacity:0; transition:opacity 1s cubic-bezier(.22,.61,.36,1); }
.app.is-playing .cover { opacity:0; }
.app.is-playing .film { opacity:1; }
.app.is-finished .film { opacity:0; }
.app.is-finished .content { opacity:1; }
.app.is-finished .cover { opacity:0; }
button { font:inherit; cursor:pointer; }
.enter { position:absolute; inset:0; z-index:5; border:0; padding:0; background:transparent; color:#fff9ef; width:100%; height:100%; touch-action:manipulation; transition:opacity .3s ease; }
.enter:focus-visible { outline:3px solid #f6d383; outline-offset:-8px; }
.enter-hint {
 position:absolute;
 top:37.0%; left:51.3%; bottom:auto;
 transform:translate(-50%,-50%);
 width:clamp(98px,28vw,128px); height:clamp(98px,28vw,128px);
 max-width:none; aspect-ratio:1;
 display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
 padding:12px; text-align:center;
 border:1px solid rgba(233,199,144,.78); border-radius:50%;
 background:linear-gradient(155deg,rgba(255,251,245,.66),rgba(255,220,231,.48));
 box-shadow:0 4px 16px rgba(99,52,60,.16),inset 0 1px rgba(255,255,255,.68);
 backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
 text-shadow:0 1px 3px rgba(255,255,255,.58);
}
.enter-hint .sparkle { display:flex; align-items:center; justify-content:center; gap:5px; font-size:14px; line-height:1; color:#b98a55; }
.enter-hint .sparkle::before,.enter-hint .sparkle::after { content:""; display:block; width:16px; height:1px; background:linear-gradient(90deg,transparent,#c5a071); }
.enter-hint .sparkle::after { transform:rotate(180deg); }
.enter-hint strong { font-size:clamp(10px,2.5vw,12px); font-weight:500; line-height:1.25; letter-spacing:.07em; text-transform:uppercase; white-space:normal; color:#7e4b5f; }
.enter-hint small { font-size:clamp(9px,2.2vw,11px); line-height:1.24; font-family:Georgia,"Times New Roman",serif; letter-spacing:.01em; opacity:.95; color:#8a5b6d; }
@media (max-width:350px) {
 .enter-hint { width:94px; height:94px; gap:3px; padding:10px; }
}
.enter[disabled] { opacity:0; visibility:hidden; pointer-events:none; }
.replay {
 position:absolute; top:max(17px,env(safe-area-inset-top)); right:16px; z-index:10;
 display:flex; align-items:center; justify-content:center; width:42px; height:42px; border:1px solid #fff9;
 border-radius:50%; color:#fff; background:#5333456b; box-shadow:0 3px 15px #261e2733; backdrop-filter:blur(10px);
 opacity:0; pointer-events:none; transform:translateY(-8px); transition:opacity .5s,transform .5s;
}
.app.is-finished .replay { opacity:1; pointer-events:auto; transform:translateY(0); }
.replay svg { width:20px; height:20px; }
.status { position:absolute; inset:auto 15% 13%; z-index:6; text-align:center; color:#fff; font:12px system-ui; text-shadow:0 1px 8px #423; opacity:0; transition:opacity .2s; pointer-events:none; }
.app.is-loading .status { opacity:1; }
@media (min-width:600px) { .app { border-left:1px solid #fffb; border-right:1px solid #fffb; } }
@media (prefers-reduced-motion:reduce) { .cover,.film,.content { transition-duration:.15s; } }

/* Confirmación WhatsApp: encajada en el recuadro crema de la ilustración final */
.rsvp-link {
 position:absolute; z-index:8; left:50%; top:70.85%;
 transform:translate(-50%,-50%) scale(.94);
 display:flex; align-items:center; justify-content:center; gap:5px;
 width:min(48%,204px); min-height:34px; padding:4px 7px;
 background:linear-gradient(180deg,rgba(255,249,245,.58),rgba(242,205,217,.47));
 border:1px solid rgba(179,133,103,.68); border-radius:999px;
 box-shadow:0 2px 6px rgba(146,96,109,.12),inset 0 1px rgba(255,255,255,.4); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
 color:#845369; text-decoration:none;
 font:500 clamp(9.5px,2.7vw,11.8px)/1.15 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 white-space:nowrap;
 opacity:0; visibility:hidden; pointer-events:none;
 transition:opacity .5s ease,transform .6s ease,visibility .5s;
}
.rsvp-link:focus-visible { outline:3px solid #8a516c; outline-offset:3px; }
.rsvp-link:active { background:rgba(244,208,222,.75); }
.rsvp-logo { display:grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;background:rgba(188,129,149,.12); }
.rsvp-logo svg { display:block;width:15px;height:15px;fill:#9c607b; }
.app.is-finished .rsvp-link {
 opacity:1; visibility:visible; pointer-events:auto;
 transform:translate(-50%,-50%) scale(1);
 transition-delay:.28s;
}
@media (min-width:600px) { .rsvp-link { font-size:11.8px; } }

/* Control musical independiente del video y visible durante toda la experiencia */
.music-toggle {
 position:absolute; z-index:12; left:14px; top:max(16px,env(safe-area-inset-top));
 width:39px; height:39px; display:grid; place-items:center;
 border:1px solid rgba(186,143,107,.65); border-radius:50%;
 color:#935f77; background:rgba(255,246,241,.61);
 box-shadow:0 3px 12px rgba(84,52,64,.13),inset 0 1px rgba(255,255,255,.56);
 backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
 transition:background .2s ease,color .2s ease;
}
.music-toggle svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.music-toggle.is-on { background:rgba(251,230,235,.72); color:#a46e82; }
.music-toggle .music-slash { opacity:1; transition:opacity .2s ease; }
.music-toggle.is-on .music-slash { opacity:0; }
.music-toggle:focus-visible { outline:3px solid #cc9b6f; outline-offset:2px; }

/* Plantilla de muestra: el escenario mantiene exactamente la proporción de la imagen.
   Las zonas de toque permanecen centradas sobre los cuatro marcos también en móvil. */
.poster-stage {
 left:50%; top:50%; right:auto; bottom:auto;
 width:max(100%,56.28dvh); height:auto;
 aspect-ratio:941 / 1672;
 transform:translate(-50%,-50%);
 container-type:inline-size;
}
.poster-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; user-select:none; -webkit-user-drag:none; pointer-events:none; }
.poster-hotspot {
 position:absolute; z-index:6;
 display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.1cqw;
 border:0; padding:0 1.3cqw;
 background:rgba(255,248,241,.04); color:#88516b;
 border-radius:12px; text-align:center; cursor:pointer;
 font-family:Georgia,"Times New Roman",serif;
 font-weight:600; line-height:1.12; letter-spacing:.015em;
 text-shadow:0 1px 0 rgba(255,255,255,.55);
 -webkit-tap-highlight-color:transparent;
 pointer-events:none; visibility:hidden;
 transition:background .2s ease, transform .2s ease;
}
.app.is-finished .poster-hotspot { pointer-events:auto; visibility:visible; }
.poster-hotspot:hover { background:rgba(255,233,235,.37); }
.poster-hotspot:active { background:rgba(247,212,226,.55); transform:scale(.98); }
.poster-hotspot:focus-visible { outline:2px solid #af7f69; outline-offset:-4px; }
.poster-date { left:34.5%; top:48.2%; width:44.8%; height:8.3%; }
.poster-place { left:34.6%; top:59.2%; width:44.5%; height:8.5%; }
.poster-date .hotspot-heading,.poster-place .hotspot-heading { font-size:clamp(13px,3.5cqw,20px); }
.hotspot-subline { font-size:clamp(10px,2.55cqw,15px); font-weight:400; color:#ab7383; }
.poster-gallery,.poster-confirm { top:71.7%; height:7.2%; font-size:clamp(11px,2.9cqw,17px); white-space:nowrap; }
.poster-gallery { left:32.1%; width:17%; }
.poster-confirm { left:65%; width:16.2%; }
/* Capa elegante para mostrar información en la prueba sin contactar a los invitados reales. */
.demo-overlay {
 position:absolute; inset:0; z-index:25; display:flex; align-items:center; justify-content:center;
 padding:20px; background:rgba(41,29,39,.62); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
 opacity:0; visibility:hidden; pointer-events:none; transition:opacity .22s,visibility .22s;
}
.demo-overlay.is-open { opacity:1; visibility:visible; pointer-events:auto; }
.demo-dialog {
 position:relative; width:min(100%,440px); max-height:82dvh; overflow-y:auto;
 border:1.5px solid #d9af79; border-radius:20px;
 background:linear-gradient(165deg,#fffdf6,#fff2f2 75%,#fce9ec);
 box-shadow:0 18px 55px rgba(37,21,30,.32),inset 0 1px #fff;
 padding:30px 22px 24px; color:#784a5c; text-align:center;
}
.demo-dialog h2 {font:normal clamp(25px,6vw,32px)/1.1 Georgia,serif; margin:4px 34px 14px;color:#91536d;}
.demo-dialog p {font:16px/1.6 Georgia,serif; margin:10px auto;max-width:35ch;}
.demo-dialog .detail-strong {font-size:20px;color:#70465a;font-weight:600;}
.demo-dialog .demo-muted {font:13px/1.5 system-ui,sans-serif;color:#956f7d;}
.demo-close {
 position:absolute; top:11px;right:11px;width:35px;height:35px;border-radius:50%;
 border:1px solid #d7ac94;background:rgba(255,255,255,.7);color:#925970;
 font:25px/1 system-ui,sans-serif;cursor:pointer;
}
.demo-cta {display:inline-flex;align-items:center;justify-content:center;margin-top:15px;padding:11px 20px;
 border:1px solid #c59b73;border-radius:25px;background:rgba(246,219,226,.6);color:#854f65;
 font:600 13px system-ui,sans-serif;text-decoration:none;}
.demo-gallery-grid {display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 0;}
.demo-gallery-grid img {width:100%;height:190px;object-fit:cover;border-radius:9px;box-shadow:0 2px 10px #7450622a;}
.demo-gallery-grid img:last-child {object-position:center;}
</style>
</head>
<body>
<main class="app" id="app">
 <img class="layer cover" src="portada.jpg" alt="Cerradura dorada rodeada de flores pastel" draggable="false">
 <video class="layer film" id="film" preload="auto" muted playsinline webkit-playsinline x-webkit-airplay="deny" disablepictureinpicture>
  <source src="transicion.mp4?v=acelerada-restaurada" type="video/mp4">
 </video>
 <section class="layer content poster-stage" aria-label="Invitación de cumpleaños María Luciana">
  <img class="poster-photo" src="contenido.jpg?v=publicidad-botones-1" alt="María Luciana, seis años, jardín encantado con cuatro marcos decorativos" draggable="false">
  <button type="button" class="poster-hotspot poster-date" data-demo="fecha" aria-label="Ver fecha y hora de la celebración"><span class="hotspot-heading">Fecha y hora</span><span class="hotspot-subline">Ver los detalles</span></button>
  <button type="button" class="poster-hotspot poster-place" data-demo="ubicacion" aria-label="Ver ubicación del evento"><span class="hotspot-heading">Ubicación</span><span class="hotspot-subline">Cómo llegar</span></button>
  <button type="button" class="poster-hotspot poster-gallery" data-demo="galeria" aria-label="Abrir galería de muestra">Galería</button>
  <button type="button" class="poster-hotspot poster-confirm" data-demo="confirmar" aria-label="Ver ejemplo de confirmación por WhatsApp">Confirmar</button>
 </section>
 
 <audio id="music" src="musica.mp3?v=alice-theme-20261016" preload="auto" loop></audio>
 <button type="button" class="music-toggle" id="musicToggle" aria-label="Reproducir música" aria-pressed="false" title="Música">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
   <path d="M9 17V5l11-2v12"/>
   <ellipse cx="6" cy="17.5" rx="3" ry="2.1"/>
   <ellipse cx="17" cy="15.5" rx="3" ry="2.1"/>
   <path class="music-slash" d="M4 4L20 20" stroke-width="2"/>
  </svg>
 </button>
 <button type="button" class="enter" id="enter" aria-label="Toca para descubrir la magia y comenzar la animación">
  <span class="enter-hint"><span class="sparkle" aria-hidden="true">✧</span><strong>Toca para</strong><small>descubrir la magia</small></span>
 </button>
 <span class="status" id="status" aria-live="polite">Abriendo la puerta mágica…</span>
 <button type="button" class="replay" id="replay" aria-label="Volver a ver la animación" title="Repetir">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><path d="M3 4v7h7"/></svg>
 </button>

 <div class="demo-overlay" id="demoOverlay" aria-hidden="true">
  <div class="demo-dialog" role="dialog" aria-modal="true" aria-labelledby="demoTitle">
   <button class="demo-close" id="demoClose" type="button" aria-label="Cerrar">×</button>
   <h2 id="demoTitle"></h2>
   <div id="demoBody"></div>
  </div>
 </div>
</main>
<script>
(() => {
 const app=document.getElementById("app");
 const detailOverlay=document.getElementById("demoOverlay");
 const detailTitle=document.getElementById("demoTitle");
 const detailBody=document.getElementById("demoBody");
 const detailClose=document.getElementById("demoClose");
 let previousFocus=null;
 const details={
  fecha:{title:"Fecha y hora",content:'<p class="detail-strong">Viernes 13 de noviembre de 2026</p><p>3:00 p. m.</p>'},
  ubicacion:{title:"Ubicación",content:'<p class="detail-strong">Jardín Real</p><p>Coto 11, casa club</p><a class="demo-cta" href="https://www.google.com/maps/search/?api=1&query=Jard%C3%ADn%20Real%20coto%2011%20casa%20club" target="_blank" rel="noopener noreferrer">Buscar en Google Maps</a><p class="demo-muted">Confirma la dirección exacta antes de viajar.</p>'},
  galeria:{title:"Galería de muestra",content:'<p class="demo-muted">Ejemplo de cómo se vería una galería de imágenes integrada en la invitación.</p><div class="demo-gallery-grid"><img loading="lazy" src="miniatura-whatsapp.jpg" alt="Escena de jardín fantástico"><img loading="lazy" src="portada.jpg" alt="Cerradura de entrada mágica"></div>'},
  confirmar:{title:"Confirmación",content:'<p class="detail-strong">¿Nos acompañas?</p><p>En una invitación personalizada, aquí tus invitados pueden confirmar por WhatsApp con un mensaje preparado para enviar.</p><p class="demo-muted">Vista de demostración: no se envían mensajes a la clienta.</p>'}
 };
 function openDemo(kind){
  const d=details[kind];if(!d||!app.classList.contains("is-finished"))return;
  previousFocus=document.activeElement;detailTitle.textContent=d.title;detailBody.innerHTML=d.content;
  detailOverlay.classList.add("is-open");detailOverlay.setAttribute("aria-hidden","false");detailClose.focus();
 }
 function closeDemo(){
  detailOverlay.classList.remove("is-open");detailOverlay.setAttribute("aria-hidden","true");
  if(previousFocus && typeof previousFocus.focus==="function")previousFocus.focus();
 }
 document.querySelectorAll(".poster-hotspot").forEach(b=>b.addEventListener("click",()=>openDemo(b.dataset.demo)));
 detailClose.addEventListener("click",closeDemo);
 detailOverlay.addEventListener("click",e=>{if(e.target===detailOverlay)closeDemo();});
 document.addEventListener("keydown",e=>{if(e.key==="Escape" && detailOverlay.classList.contains("is-open"))closeDemo();});

 const video=document.getElementById("film");
 const enter=document.getElementById("enter");
 const replay=document.getElementById("replay");
 const status=document.getElementById("status");
 const music=document.getElementById("music");
 const musicToggle=document.getElementById("musicToggle");
 let musicWanted=false;
 function syncMusicControl(){
  const playing=!music.paused && !music.muted;
  musicToggle.classList.toggle("is-on",playing);
  musicToggle.setAttribute("aria-pressed",String(playing));
  musicToggle.setAttribute("aria-label",playing?"Pausar música":"Reproducir música");
  musicToggle.title=playing?"Pausar música":"Reproducir música";
 }
 function playMusic(){
  musicWanted=true;
  music.muted=false;
  if(!music.paused){syncMusicControl();return;}
  try{
   const pending=music.play();
   if(pending&&typeof pending.catch==="function")pending.catch(()=>syncMusicControl());
  }catch(e){syncMusicControl();}
 }
 music.addEventListener("play",syncMusicControl);
 music.addEventListener("pause",syncMusicControl);
 music.addEventListener("volumechange",syncMusicControl);
 musicToggle.addEventListener("click",()=>{
  if(music.paused||music.muted){playMusic();}
  else{musicWanted=false;music.pause();}
 });
 // En móvil, intentar iniciar el audio al tocar, sin esperar a que se suelte el dedo.
 enter.addEventListener("pointerdown",playMusic,{passive:true});
 enter.addEventListener("touchstart",playMusic,{passive:true});
 // Si iOS interrumpe el audio al empezar el video silenciado, procurar reanudarlo.
 video.addEventListener("playing",()=>{
  if(musicWanted&&music.paused)playMusic();
 });
 let waiting=false;
 const end=()=>{app.classList.remove("is-loading");app.classList.add("is-finished");video.pause();};
 function start(){
  if(waiting)return;
  playMusic(); // Respaldo para clic o teclado, con gesto directo del visitante.
  waiting=true;
  app.classList.remove("is-finished","is-playing");
  app.classList.add("is-loading");
  enter.disabled=true;
  status.textContent="Abriendo la puerta mágica…";
  video.currentTime=0;
  video.muted=true; // Solo el video de transición, sin afectar la música independiente.
  const result=video.play();
  if(result&&typeof result.then==="function"){
   result.then(()=>{app.classList.remove("is-loading");app.classList.add("is-playing");waiting=false;})
   .catch(()=>{waiting=false;enter.disabled=false;app.classList.remove("is-loading");status.textContent="Toca de nuevo para entrar";});
  }else{app.classList.remove("is-loading");app.classList.add("is-playing");waiting=false;}
 }
 enter.addEventListener("click",start);
 replay.addEventListener("click",()=>{
  video.pause();video.currentTime=0;
  app.classList.remove("is-finished","is-playing","is-loading");
  enter.disabled=false;
 });
 video.addEventListener("ended",end);
 video.addEventListener("error",()=>{
  if(app.classList.contains("is-playing")||app.classList.contains("is-loading"))end();
 });
 video.addEventListener("timeupdate",()=>{
  if(Number.isFinite(video.duration)&&video.duration-video.currentTime<.09)end();
 });
 document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&app.classList.contains("is-playing"))video.pause();
  if(!document.hidden&&app.classList.contains("is-playing"))video.play().catch(()=>end());
 });
})();
</script>
</body></html>
