<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edd2ce">
  <meta name="description" content="Prueba de transición interactiva para los XV años de Valeria Guadalupe · Aura Digital">
  <meta property="og:title" content="Valeria Guadalupe · Mis XV años">
  <meta property="og:description" content="Una invitación especial · 11 de diciembre de 2026">
  <title>Valeria Guadalupe | Prueba de transición</title>
  <style>
    :root {color-scheme:light; --rose:#8c5360; --cream:#f9eeee}
    * { box-sizing:border-box }
    html,body {margin:0; width:100%; min-height:100%; background:#f4e1dc}
    body {font-family:Georgia,'Times New Roman',serif; overflow:hidden; overscroll-behavior:none}
    #app {position:relative; width:100vw; height:100svh; height:100dvh; overflow:hidden; background:linear-gradient(140deg,#f7eae6,#edcfcb)}
    .scene {position:absolute;inset:0;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .16s ease}
    .scene.on {opacity:1;pointer-events:auto}
    .scene img,.scene video {display:block; height:100%;width:100%;object-fit:contain;object-position:center; background:#f3dfdb}
    .scene video {background:#f3dfdb}
    .seal {position:absolute; z-index:5; top:65.5%;left:50%;transform:translate(-50%,-50%);width:min(24vw,14.2dvh);height:min(24vw,14.2dvh);min-width:72px;min-height:72px;border:0;border-radius:50%;background:transparent;cursor:pointer;touch-action:manipulation; -webkit-tap-highlight-color:transparent}
    .seal:focus-visible {outline:3px solid #a55c6a; outline-offset:5px}
    .seal::after {content:"";display:block;position:absolute;inset:3px;border-radius:50%;border:1.5px solid #fff9;animation:pulse 2.7s ease-in-out infinite;pointer-events:none}
    @keyframes pulse {0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.13);opacity:.1}}
    .tools {position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:8;pointer-events:none}
    .tools button {pointer-events:auto;border:1px solid #c7969f;border-radius:99px;background:#fffdf6eb;color:var(--rose);padding:11px 17px;box-shadow:0 5px 24px #713c4830;letter-spacing:.025em;font-family:inherit;font-size:14px;cursor:pointer}
    .tools button:focus-visible {outline:2px solid var(--rose);outline-offset:3px}
    .status {position:absolute;z-index:9;left:50%;bottom:max(78px,calc(env(safe-area-inset-bottom) + 64px));transform:translateX(-50%);background:#fffdf7e8;color:#874b58;border-radius:12px;padding:12px 16px;font-size:13px;text-align:center;max-width:90vw;box-shadow:0 6px 26px #78505a33}
    [hidden] {display:none!important}
    @media (min-aspect-ratio: 9/16) { .seal {width:min(12svh,118px);height:min(12svh,118px);min-width:0;min-height:0;} }
    @media (prefers-reduced-motion:reduce) {.scene {transition:none}.seal::after {animation:none}}
  </style>
</head>
<body>
<main id="app" aria-label="Invitación de XV años de Valeria Guadalupe">
  <section id="cover" class="scene on" aria-label="Portada">
    <img src="portada.jpg" alt="Portada de Valeria Guadalupe con sobre y sello rosa" decoding="async" fetchpriority="high" draggable="false">
    <button type="button" id="open" class="seal" aria-label="Tocar el sello para abrir la invitación" title="Toca el sello para abrir"></button>
  </section>
  <section id="motion" class="scene" aria-label="Apertura del sobre" aria-hidden="true">
    <video id="video" playsinline webkit-playsinline preload="auto" poster="portada.jpg" disablepictureinpicture controlslist="nodownload noplaybackrate" aria-label="El sobre se abre y aparece la tarjeta de padres y padrinos">
      <source src="transicion.mp4" type="video/mp4">
    </video>
  </section>
  <section id="end" class="scene" aria-label="Mis padres y padrinos" aria-hidden="true">
    <img src="padres-padrinos.jpg" alt="Información de los padres y padrinos de Valeria Guadalupe" decoding="async" draggable="false">
    <div class="tools"><button type="button" id="again">↻ Volver a ver la animación</button><button type="button" id="reset">⌂ Portada</button></div>
  </section>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
</main>
<script>
(() => {
  const cover=document.getElementById('cover'),motion=document.getElementById('motion'),end=document.getElementById('end');
  const video=document.getElementById('video'),status=document.getElementById('status');
  let playing=false;
  const layers=[cover,motion,end];
  function show(layer){for(const item of layers){const active=item===layer;item.classList.toggle('on',active);if(item!==cover)item.setAttribute('aria-hidden',String(!active));}}
  function message(text){status.textContent=text;status.hidden=!text;}
  function complete(){playing=false;video.pause();message('');show(end);}
  function restart(){playing=false;video.pause();video.currentTime=0;message('');show(cover);}
  async function begin(){
    if(playing)return;playing=true;message('');
    try {
      video.pause();video.currentTime=0;video.muted=false;
      // play() is called synchronously from the touch/click gesture (iOS Safari).
      const p=video.play();
      if(p&&typeof p.then==='function')await p;
      show(motion);
    }catch(err){
      playing=false;message('Toca para reproducir la animación.');
      show(motion);video.controls=true;
    }
  }
  document.getElementById('open').addEventListener('click',begin);
  document.getElementById('again').addEventListener('click',begin);
  document.getElementById('reset').addEventListener('click',restart);
  video.addEventListener('ended',complete);
  video.addEventListener('error',()=>{playing=false;message('No se pudo cargar el video. Revisa que transicion.mp4 esté publicado.');show(cover);});
  video.addEventListener('playing',()=>{message('');show(motion);});
  // Load the final card early, preventing a blank flash after the video.
  const preload=new Image();preload.src='padres-padrinos.jpg';
  // If media is not installed yet, show a useful diagnostic instead of a broken page.
  document.querySelector('#cover img').addEventListener('error',()=>message('Falta subir portada.jpg a esta misma carpeta.'));
})();
</script>
</body>
</html>
