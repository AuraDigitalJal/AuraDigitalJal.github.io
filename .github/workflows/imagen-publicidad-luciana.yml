name: Añadir imagen final para demostración
on:
  push:
    paths:
      - '.github/workflows/imagen-publicidad-luciana.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar imagen enviada y verificar su integridad
        env:
          IMAGE_URL: "https://at.adobe.com/c4BCm46dwHBZ4dlS"
        run: |
          set -euo pipefail
          TARGET="pruebas/cerradura-luciana-2026/contenido-publicidad.png"
          curl -fLsS --retry 3 "$IMAGE_URL" -o "$TARGET"
          echo "fa1be3964346eac1f8f588206a79d6b49a7a085e592dd592be338b49d6848e04  $TARGET" | sha256sum -c -
          file "$TARGET"
      - name: Guardar imagen en la prueba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruebas/cerradura-luciana-2026/contenido-publicidad.png
          if ! git diff --cached --quiet; then
            git commit -m "Añadir imagen de cuatro secciones para demostración"
            git push origin HEAD:main
          fi
