name: Reemplazar transición original María Luciana
on:
  push:
    paths:
      - '.github/workflows/subir-video-original-luciana.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y verificar MP4 original
        env:
          VIDEO_ORIGINAL: "https://at.adobe.com/C9GLYLLxyCxwEisu"
        run: |
          set -euo pipefail
          TARGET="pruebas/cerradura-luciana-2026/transicion.mp4"
          curl -fLsS --retry 3 "$VIDEO_ORIGINAL" -o "$TARGET"
          echo "13284fb82e0ad399c5cb8a6a0548b3968e8b06f42b7e792e028c3fc271fc4b49  $TARGET" | sha256sum -c -
          file "$TARGET"
      - name: Publicar exclusivamente el MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruebas/cerradura-luciana-2026/transicion.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Reemplazar video por MP4 original suministrado de Maria Luciana"
            git push origin HEAD:main
          fi
