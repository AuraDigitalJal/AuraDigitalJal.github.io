name: One-time Aura site first paint correction
on:
  push:
    paths:
      - ".github/workflows/aura-correct-first-paint-once.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary splash and reveal after current data renders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old_style='<style id="aura-preview-boot">html.aura-preview-await body{visibility:hidden!important}html.aura-preview-await:not(.aura-preview-mode)::after{content:"AURA DIGITAL";position:fixed;inset:0;display:grid;place-items:center;background:#faf7f1;color:#151515;font:600 15px/1 system-ui,sans-serif;letter-spacing:.26em;z-index:2147483647}</style>'
          old_script='<script>(function(){var root=document.documentElement;var isPreview=new URLSearchParams(location.search).has("preview");root.classList.add("aura-preview-await");if(isPreview){root.classList.add("aura-preview-mode");}else{document.addEventListener("DOMContentLoaded",function(){root.classList.remove("aura-preview-await");},{once:true});}})();</script>'
          old_end='bindShell();bindPreviewEditing();apply();'
          new_style='<style id="aura-preview-boot">html.aura-preview-await body{visibility:hidden!important}</style>'
          new_script='<script>document.documentElement.classList.add("aura-preview-await");</script>'
          new_end="bindShell();bindPreviewEditing();try{apply()}finally{if(!previewMode)document.documentElement.classList.remove('aura-preview-await')}"
          assert len(s)>3000000,"Unexpected file size; abort"
          assert s.count(old_style)==1 and s.count(old_script)==1 and s.count(old_end)==1,"Expected boot code changed; abort"
          s=s.replace(old_style,new_style).replace(old_script,new_script).replace(old_end,new_end)
          assert s.count("AURA DIGITAL\";position:fixed")==0
          p.write_text(s,encoding="utf-8")
          print("One root HTML patched; public state/assets preserved")
          PY
      - name: Publish only root index
        shell: bash
        run: |
          git diff --check
          git config user.name "Aura Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove temporary splash; show site after current state is applied"
          git push
