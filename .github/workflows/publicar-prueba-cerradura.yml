name: Publicar prueba de cerradura
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publicar-prueba-cerradura.yml'
permissions:
  contents: write
jobs:
  subir-multimedia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar las imágenes y el video originales
        env:
          PORTADA_URL: "https://at.adobe.com/9YFAeRV87TB74Dla"
          FINAL_URL: "https://at.adobe.com/QPiir61fZwHC9X1o"
          VIDEO_URL: "https://at.adobe.com/mZRr0LAlrSbXjzmP"
        run: |
          set -euo pipefail
          mkdir -p pruebas/cerradura-luciana-2026
          curl -fLsS --retry 3 "$PORTADA_URL" -o pruebas/cerradura-luciana-2026/portada.jpg
          curl -fLsS --retry 3 "$FINAL_URL" -o pruebas/cerradura-luciana-2026/contenido.jpg
          curl -fLsS --retry 3 "$VIDEO_URL" -o pruebas/cerradura-luciana-2026/transicion.mp4
          python3 - <<'PY'
          from pathlib import Path
          root=Path("pruebas/cerradura-luciana-2026")
          files={"portada.jpg":b"\xff\xd8\xff", "contenido.jpg":b"\xff\xd8\xff", "transicion.mp4":b"\x00\x00"}
          for fname,magic in files.items():
              f=root/fname
              data=f.read_bytes()
              print(fname, len(data), data[:20])
              if len(data)<10000 or not data.startswith(magic):
                  raise ValueError(f"Archivo descargado no válido: {fname}")
          PY
      - name: Guardar multimedia en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruebas/cerradura-luciana-2026/
          if ! git diff --cached --quiet; then
            git commit -m "Agregar multimedia original de prueba cerradura"
            git push origin HEAD:main
          fi
