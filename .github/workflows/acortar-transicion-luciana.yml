name: Acortar transición de Luciana
on:
  push:
    paths:
      - '.github/workflows/acortar-transicion-luciana.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recrear transición acelerada de 2.67 segundos
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          cd pruebas/cerradura-luciana-2026
          ffmpeg -hide_banner -loglevel error -y -i transicion.mp4 \
            -vf "setpts=(PTS-STARTPTS)/1.72,fps=30" \
            -t 2.666667 -an -c:v libx264 -preset medium -crf 21 \
            -pix_fmt yuv420p -movflags +faststart transicion-nueva.mp4
          python3 - <<'PY'
          import os,subprocess
          f="transicion-nueva.mp4"
          size=os.stat(f).st_size
          dur=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",f]))
          print(f"Duracion {dur:.4f} s; peso {size} bytes")
          if size<200000 or not 2.60 <= dur <= 2.75:
              raise RuntimeError("Video procesado no válido")
          PY
          mv transicion-nueva.mp4 transicion.mp4
      - name: Guardar video actualizado en la prueba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruebas/cerradura-luciana-2026/transicion.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar transicion de Luciana a 2.67 segundos, sin audio"
            git push origin HEAD:main
          fi
