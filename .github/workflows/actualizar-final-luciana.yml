name: Actualizar imagen final Luciana
on:
  push:
    paths:
      - '.github/workflows/actualizar-final-luciana.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar nueva imagen final
        env:
          FINAL_URL: "https://at.adobe.com/WUpQI45eUjwmdOcx"
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "$FINAL_URL" -o pruebas/cerradura-luciana-2026/contenido.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pruebas/cerradura-luciana-2026/contenido.jpg")
          b=p.read_bytes()
          print(f"Imagen final: {len(b)} bytes")
          if len(b)<100000 or not b.startswith(b"\xff\xd8\xff"):
              raise ValueError("La imagen descargada no es un JPEG válido")
          PY
      - name: Guardar imagen nueva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruebas/cerradura-luciana-2026/contenido.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Sustituir pantalla final con invitación María Luciana"
            git push origin HEAD:main
          fi
