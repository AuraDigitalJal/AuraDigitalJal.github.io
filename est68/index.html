emplate-columns:repeat(3,1fr);gap:11px}.bar{padding:10px 12px;background:#f4f8f9;border-radius:8px}.bar b{font-size:12px}.line{height:7px;background:#dbe4e9;margin-top:8px;border-radius:20px;overflow:hidden}.line i{height:100%;display:block;background:#478b95;border-radius:20px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field label{display:block;font-size:12px;font-weight:750;color:#465c6a;margin-bottom:5px}.field{margin-bottom:14px}.note{border:1px solid #d7e3e6;background:#eff7f8;padding:12px 14px;border-radius:10px;color:#315568;font-size:12px}.alert{background:#fce9e5;color:#8e4137;padding:12px;border-radius:9px;margin-bottom:12px}.success{background:#e2f5ea;color:#236749;padding:12px;border-radius:9px;margin-bottom:12px}.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.alert-header{border:1px solid #d9a757;background:#fff5e2;color:#79521b;font-weight:750}.alert-header b{background:#965a17;color:#fff;border-radius:20px;padding:2px 7px;margin-left:5px}.alerts-modal{width:min(920px,100%)}.alerts-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}.alerts-stats>div{padding:16px;border:1px solid #e6e8e9;border-radius:12px;display:flex;gap:11px;align-items:center}.alerts-stats strong{font-size:26px;color:#ad4a25}.alerts-stats span{font-size:12px;color:#697a84}.alerts-list{display:grid;gap:10px}.alert-item{padding:15px;border:1px solid #e2e7e9;border-radius:12px}.alert-item.critical{background:#fff7f1;border-left:5px solid #b75831}.alert-item.preventive{background:#faf7eb;border-left:5px solid #b69848}.alert-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.alert-item-top strong{font-size:14px}.alert-item-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;flex-wrap:wrap}.report-count{white-space:nowrap;font-size:12px;font-weight:750;color:#8b492f;border-radius:40px;background:#f8e2d9;padding:5px 10px}.alert-proof{display:block;padding:12px;border:1px solid #d9e5e8;border-radius:10px;margin:8px 0;cursor:pointer}.alert-proof:has(input:checked){border-color:#2b7886;background:#eaf5f7}.alert-proof small{display:block;color:#687985;padding-left:23px}.alert-info{font-size:12px;color:#63717d}.muted{color:#70838e}@media(max-width:680px){.alerts-stats{grid-template-columns:1fr}.header-actions{justify-content:flex-start}.alert-item-top,.alert-item-bottom{align-items:flex-start}.alert-item-bottom{display:block}.alert-item-bottom .buttons{margin-top:9px}}
.overlay{position:fixed;inset:0;background:#071a26a6;display:grid;place-items:center;padding:14px;z-index:9}.modal{background:white;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:16px;box-shadow:0 20px 80px #0c182950;padding:24px}.modalheader{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}.modalheader h2{margin:0;font-size:20px}.modalheader small{color:#7d8b95}.detail{margin-top:15px}.detail b{font-size:12px;color:#768591;letter-spacing:.03em;display:block;text-transform:uppercase}.detail p{white-space:pre-wrap;margin:5px 0}.timeline{border-left:3px solid #ccdde1;padding-left:16px;margin:12px 0}.timeline-item{margin-bottom:14px}.timeline-item b{font-size:13px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gap{height:16px}.footer{font-size:11px;color:#80909b;margin-top:30px}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(130deg,#102d3a,#234859)}.login-card{background:white;border-radius:19px;padding:40px;max-width:440px;width:100%;box-shadow:0 12px 65px #0004}.login-card h1{font-size:26px;margin:18px 0 7px}.login-card p{color:#687c88}.nowrap{white-space:nowrap}a{color:#1b6677}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:190px 1fr}.graph{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{display:block}.side{padding:12px;gap:8px}.side-label,.sidebar-foot{display:none}.brand{padding:1px}.nav{display:flex;flex-direction:row;overflow-x:auto;gap:5px}.nav button{padding:8px 10px;white-space:nowrap;font-size:11px}.nav button.active:before{display:none}.top{padding:16px 18px}.top h1{font-size:18px}.content{padding:18px 12px 48px}.panel{padding:15px}.stat{padding:14px}.stat .num{font-size:25px}.heading h2{font-size:22px}.grid2,.graph{grid-template-columns:1fr}.modal{padding:17px}}

</style></head><body><div id="app"><div class="login"><div class="login-card"><b>EST 68</b><h1>Preparando plataforma…</h1><p>Verificando acceso de prueba.</p></div></div></div><script>
(function(){'use strict';
const app=document.getElementById('app');
const esc=s=>String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const severityBadge=s=>'<span class="badge '+esc((s||'SIN CLASIFICAR').replaceAll(' ','_'))+'">'+esc(s||'SIN CLASIFICAR')+'</span>';
const key=(()=>{const k=decodeURIComponent((location.hash||'').replace(/^#acceso=/,''));if(k && k.length>30){sessionStorage.setItem('est68-test-key',k);history.replaceState(null,'',location.pathname+location.search);return k;}return sessionStorage.getItem('est68-test-key')||'';})();
let D={students:[],reports:[],followups:[],teachers:[],subjects:[],assignments:[],alertVerifications:[]},tab='resumen',term='',group='TODOS',severity='TODAS',dialog='',chosen='',msg='',status='',alertReturnStudent='';
const student=id=>D.students.find(x=>x.id===id)||null;
const reportsFor=id=>D.reports.filter(x=>x.student_id===id).sort((a,b)=>b.report_date.localeCompare(a.report_date));
const fupsFor=id=>D.followups.filter(x=>x.report_id===id).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-MX',{year:'numeric',month:'short',day:'numeric'}):'—';
const tip=t=>'<p class="note">'+esc(t)+'</p>';
const navs=[['resumen','▦','Resumen'],['reportes','▤','Reportes'],['alumnos','♧','Alumnos'],['captura','＋','Nuevo reporte']];

function activeAlerts(){
 const counts=new Map();
 D.reports.forEach(r=>counts.set(r.student_id,(counts.get(r.student_id)||0)+1));
 const cleared=new Map();
 (D.alertVerifications||[]).forEach(v=>cleared.set(v.student_id,Math.max(cleared.get(v.student_id)||0,Number(v.report_count_at_verification)||0)));
 return D.students.flatMap(s=>{
  const n=counts.get(s.id)||0;
  if(n<2)return [];
  if(n>=3&&n<=(cleared.get(s.id)||0))return [];
  return [{student:s,count:n,level:n>=3?'critical':'notice'}];
 }).sort((a,b)=>b.count-a.count||a.student.group_code.localeCompare(b.student.group_code)||a.student.full_name.localeCompare(b.student.full_name));
}
function alertProofs(studentId){
 const ids=new Set(D.reports.filter(r=>r.student_id===studentId).map(r=>r.id));
 return D.followups.filter(f=>ids.has(f.report_id)&&f.status==='realizado'&&(f.kind==='citatorio'||(f.kind==='medida'&&norm(f.detail).includes('cambio de activ'))));
}
function alertsMarkup(){
 const arr=activeAlerts(),critical=arr.filter(a=>a.count>=3).length,notices=arr.filter(a=>a.count===2).length;
 return '<div class="alerts-stats"><div><strong>'+critical+'</strong><span>Requieren verificación (3 o más)</span></div><div><strong>'+notices+'</strong><span>Atención preventiva (2 reportes)</span></div></div>'+
 '<p class="note">Con tres o más reportes se debe comprobar que exista un citatorio o cambio de actividad realizado. La alerta se quita solo al pulsar Verificar; si se añade otro reporte, vuelve a aparecer.</p>'+
 (arr.length?'<div class="alerts-list">'+arr.map(a=>'<article class="alert-item '+(a.count>=3?'critical':'preventive')+'"><div class="alert-item-top"><div><strong>'+esc(a.student.full_name)+'</strong><div class="muted">'+esc(a.student.group_code)+' · Ciclo 2026–2027</div></div><span class="report-count">'+a.count+' reportes</span></div><div class="alert-item-bottom"><span class="muted">'+(a.count>=3?'Revisión de citatorio o cambio de actividad pendiente.':'Seguimiento preventivo: revisar reincidencia.')+'</span><div class="buttons"><button class="btn" data-student="'+esc(a.student.id)+'">Expediente</button>'+(a.count>=3?'<button class="btn primary" data-alert-review="'+esc(a.student.id)+'">Verificar actuación</button>':'')+'</div></div></article>').join('')+'</div>':'<div class="empty"><h3>No hay alertas activas</h3><p>Los casos verificados se conservan en el historial y reaparecerán al recibir nuevos reportes.</p></div>');
}

async function api(op,body){const res=await fetch('https://cwtgpbdaxdnruwuqgqax.supabase.co/functions/v1/est68-evaluacion?op='+encodeURIComponent(op),{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-est68-token':key},body:body?JSON.stringify(body):undefined,cache:'no-store'});let d;try{d=await res.json()}catch{throw Error('Respuesta de servidor no válida.')}if(!res.ok)throw Error(d.error||'No se pudo realizar la operación.');return d;}
async function refresh(){status='Cargando datos reales…';render();try{D=await api('bootstrap');status='';render()}catch(e){status='ERROR: '+e.message;render()}}
function shell(title,content){return '<div class="shell"><aside class="side"><div class="brand"><div class="mark">68</div><div><b>EST 68</b><small>Seguimiento de reportes</small></div></div><div class="side-label">PLATAFORMA ESCOLAR</div><nav class="nav">'+navs.map(n=>'<button data-tab="'+n[0]+'" class="'+(tab===n[0]?'active':'')+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'</nav><div class="sidebar-foot"><b>PRUEBA ADMINISTRATIVA</b>Ciclo escolar 2026–2027<br>Acceso provisional mediante enlace privado</div></aside><div class="main"><header class="top"><div><small>ESCUELA SECUNDARIA TÉCNICA N.º 68</small><h1>'+esc(title)+'</h1></div><div class="header-actions"><button class="btn alert-header" data-open-alerts>⚠ Alertas <b>'+activeAlerts().length+'</b></button><span class="chip">● Base real conectada</span></div></header><div class="content">'+(msg?'<div class="success">'+esc(msg)+'</div>':'')+(status?'<div class="'+(status.startsWith('ERROR')?'alert':'note')+'">'+esc(status)+'</div>':'')+content+'<div class="footer">EST 68 · Sistema de reportes · Acceso provisional de prueba. No compartas el enlace de acceso con personas no autorizadas.</div></div></div></div>'+(dialog?renderDialog():'');}
const grouped=()=>Object.fromEntries(['1°A','1°B','1°C','2°A','2°B','2°C','3°A','3°B','3°C'].map(g=>[g,D.reports.filter(r=>r.group_code===g).length]));
function stat(label,n,sub){return '<div class="stat"><small>'+label+'</small><span class="num">'+esc(n)+'</span><small>'+sub+'</small></div>'}
function summary(){const gr=grouped(),mx=Math.max(1,...Object.values(gr));const latest=[...D.reports].sort((a,b)=>b.report_date.localeCompare(a.report_date)).slice(0,8);return '<div class="heading"><div><h2>Panel general</h2><div class="lead">Información real del ciclo 2026–2027</div></div><div class="buttons"><button class="btn alert-header" data-open-alerts>⚠ Revisar alertas ('+activeAlerts().length+')</button><button class="btn" data-refresh>↻ Actualizar</button><button class="btn" data-export>⇩ Excel / CSV</button><button class="btn primary" data-tab="captura">＋ Nuevo reporte</button></div></div><div class="stats">'+stat('Alumnos registrados',D.students.length,'9 grupos escolares')+stat('Reportes',D.reports.length,'Historial cargado')+stat('Actuaciones',D.followups.length,'Seguimiento documentado')+stat('Pendientes',D.followups.filter(f=>f.status==='pendiente'||f.status==='asignado').length,'Pendientes o asignados')+'</div><div class="panel"><h3>Reportes por grupo</h3><div class="graph">'+Object.entries(gr).map(([g,v])=>'<div class="bar"><div class="flex" style="justify-content:space-between"><b>'+esc(g)+'</b><b>'+v+'</b></div><div class="line"><i style="width:'+(v/mx*100).toFixed(0)+'%"></i></div></div>').join('')+'</div></div><div class="panel"><h3>Reportes recientes</h3>'+reportTable(latest)+'</div>'}
function reportTable(rs){return rs.length?'<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Alumno</th><th>Grupo</th><th>Materia</th><th>Tipo</th></tr></thead><tbody>'+rs.map(r=>'<tr class="data" data-report="'+esc(r.id)+'"><td class="nowrap">'+esc(date(r.report_date))+'</td><td class="strong">'+esc(student(r.student_id)?.full_name||'—')+'</td><td>'+esc(r.group_code)+'</td><td>'+esc(r.subject_snapshot||'—')+'</td><td>'+severityBadge(r.severity)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No hay reportes con los filtros seleccionados.</div>'}
function reportScreen(){let rs=D.reports.filter(r=>{const s=student(r.student_id);return (group==='TODOS'||r.group_code===group)&&(severity==='TODAS'||r.severity===severity)&&norm((s?.full_name||'')+' '+r.reason+' '+r.subject_snapshot).includes(norm(term))}).sort((a,b)=>b.report_date.localeCompare(a.report_date));return '<div class="heading"><div><h2>Historial de reportes</h2><div class="lead">'+rs.length+' registros encontrados</div></div><div class="buttons"><button class="btn" data-export>⇩ Excel / CSV</button><button class="btn" data-print>Imprimir / PDF</button><button class="btn primary" data-tab="captura">＋ Capturar</button></div></div><div class="panel"><div class="toolbar"><input class="input search" data-filter="term" placeholder="Buscar alumno, motivo o materia…" value="'+esc(term)+'"><select class="input" data-filter="group"><option value="TODOS">Todos los grupos</option>'+['1°A','1°B','1°C','2°A','2°B','2°C','3°A','3°B','3°C'].map(g=>'<option '+(group===g?'selected':'')+'>'+g+'</option>').join('')+'</select><select class="input" data-filter="severity">'+['TODAS','LEVE','GRAVE','MUY GRAVE','SIN CLASIFICAR'].map(s=>'<option '+(severity===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div>'+reportTable(rs)+'</div>'}
function studentScreen(){const ss=D.students.filter(s=>(group==='TODOS'||s.group_code===group)&&norm(s.full_name).includes(norm(term)));const count=new Map();D.reports.forEach(r=>count.set(r.student_id,(count.get(r.student_id)||0)+1));return '<div class="heading"><div><h2>Alumnos</h2><div class="lead">'+ss.length+' alumnos encontrados</div></div><div class="buttons"><button class="btn primary" data-new-student>＋ Agregar alumno</button></div></div><div class="panel"><div class="toolbar"><input class="input search" data-filter="term" placeholder="Buscar nombre o apellido…" value="'+esc(term)+'"><select class="input" data-filter="group"><option value="TODOS">Todos los grupos</option>'+['1°A','1°B','1°C','2°A','2°B','2°C','3°A','3°B','3°C'].map(g=>'<option '+(group===g?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div class="table-wrap"><table><thead><tr><th>Nombre completo</th><th>Grupo</th><th>N.º lista</th><th>Reportes</th></tr></thead><tbody>'+ss.map(s=>'<tr class="data" data-student="'+esc(s.id)+'"><td class="strong">'+esc(s.full_name)+'</td><td>'+esc(s.group_code)+'</td><td>'+esc(s.enrollment_no||'—')+'</td><td>'+esc(count.get(s.id)||0)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function reportFields(r){r=r||{};const chosenStudent=r.student_id||'';return '<div class="grid2"><div class="field"><label>Alumno *</label><select name="student_id" class="input" required><option value="">Selecciona un alumno</option>'+D.students.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===chosenStudent?'selected':'')+'>'+esc(s.full_name)+' · '+esc(s.group_code)+'</option>').join('')+'</select></div><div class="field"><label>Fecha de reporte *</label><input class="input" name="report_date" type="date" required value="'+esc(r.report_date||new Date().toISOString().slice(0,10))+'"></div><div class="field"><label>Materia / Área</label><input name="subject_snapshot" class="input" placeholder="Materia o Prefectura" value="'+esc(r.subject_snapshot||'')+'"></div><div class="field"><label>Docente que reporta</label><input name="teacher_snapshot" list="docentes" class="input" value="'+esc(r.teacher_snapshot||'')+'"><datalist id="docentes">'+D.teachers.map(t=>'<option value="'+esc(t.full_name)+'">').join('')+'</datalist></div><div class="field"><label>Tipo de falta *</label><select name="severity" class="input">'+['LEVE','GRAVE','MUY GRAVE','SIN CLASIFICAR'].map(x=>'<option '+((r.severity||'LEVE')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="field"><label>Motivo del reporte *</label><textarea class="input" name="reason" rows="5" required minlength="3" maxlength="5000">'+esc(r.reason||'')+'</textarea></div><div class="field"><label>Acuerdos establecidos</label><textarea class="input" name="agreements" rows="3">'+esc(r.agreements||'')+'</textarea></div>'}
function capture(){return '<div class="heading"><div><h2>Nuevo reporte</h2><div class="lead">Registra una incidencia directamente en la base escolar</div></div></div><div class="panel">'+tip('El reporte que guardes aquí será REAL y quedará en el historial del alumno. Verifica la información antes de confirmar.')+'<div class="gap"></div><form id="new-report">'+reportFields()+'<div class="buttons"><button type="submit" class="btn primary">Guardar reporte</button><button type="button" class="btn" data-tab="reportes">Cancelar</button></div></form></div>'}
function renderDialog(){
if(dialog==='alerts')return '<div class="overlay"><div class="modal alerts-modal"><div class="modalheader"><div><small>SEGUIMIENTO DE REINCIDENCIAS</small><h2>⚠ Alertas de alumnos</h2><span class="muted">Información real, actualizada desde la base escolar</span></div><button type="button" class="btn" data-close aria-label="Cerrar alertas">✕</button></div>'+alertsMarkup()+'<div class="gap"></div><button type="button" class="btn" data-close>Cerrar ventana</button></div></div>';
if(dialog==='verifyAlert'){
 const s=student(chosen),a=activeAlerts().find(x=>x.student.id===chosen);
 if(!s||!a||a.count<3)return '<div class="overlay"><div class="modal"><h2>Sin verificación pendiente</h2><p>No hay una alerta de tres reportes o más para este alumno.</p><button class="btn" data-open-alerts>Volver a alertas</button></div></div>';
 const proofs=alertProofs(chosen);
 const report=reportsFor(chosen)[0];
 return '<div class="overlay"><div class="modal"><div class="modalheader"><div><small>VALIDACIÓN DE MEDIDA ESCOLAR</small><h2>'+esc(s.full_name)+'</h2><span class="muted">'+esc(s.group_code)+' · '+a.count+' reportes</span></div><button type="button" class="btn" data-close>✕</button></div>'+
 '<p class="note">Selecciona un citatorio o cambio de actividad <b>registrado como realizado</b> y confirma que verificaste la actuación. La alerta quedará archivada, pero los reportes se conservan. Si se registra otro reporte, reaparecerá.</p>'+
 (proofs.length?'<form id="verify-alert"><label class="field"><span>Actuación comprobada</span><select class="input" name="supporting_followup_id" required>'+proofs.map(f=>'<option value="'+esc(f.id)+'">'+(f.kind==='citatorio'?'Citatorio':'Cambio de actividad')+' · '+esc(date(f.action_date))+' · '+esc(f.detail.slice(0,100))+'</option>').join('')+'</select></label><div class="field"><label>Observación de verificación (opcional)</label><textarea class="input" name="verification_note" rows="2" maxlength="1000" placeholder="Ej. Se cotejó el citatorio recibido en Trabajo Social."></textarea></div><label class="alert-proof"><input type="checkbox" name="acknowledge" required> <b>Confirmo que revisé la actuación y su evidencia.</b><small>No modifica ni borra los reportes originales.</small></label><div class="buttons"><button type="submit" class="btn primary">✓ Verificar y quitar alerta</button><button type="button" class="btn" data-open-alerts>Volver</button></div></form>':
 '<div class="alert">Todavía no hay un citatorio o cambio de actividad marcado como realizado para este alumno. Primero registra la actuación en uno de sus reportes; no se puede eliminar la alerta sin comprobarla.</div><div class="buttons"><button class="btn primary" data-alert-add="'+esc(s.id)+'">＋ Registrar actuación</button><button class="btn" data-open-alerts>Volver a alertas</button></div>')+
 '</div></div>';
}
if(dialog==='student'){const s=student(chosen);if(!s)return '';const rs=reportsFor(s.id);return '<div class="overlay"><div class="modal"><div class="modalheader"><div><small>EXPEDIENTE DE ALUMNO</small><h2>'+esc(s.full_name)+'</h2><span class="muted">'+esc(s.group_code)+' · Lista '+esc(s.enrollment_no||'—')+' · 2026–2027</span></div><button class="btn" data-close>✕</button></div><div class="heading"><h3>Reportes: '+rs.length+'</h3><button class="btn" data-edit-student="'+esc(s.id)+'">Editar alumno</button></div>'+reportTable(rs)+'<div class="gap"></div><button class="btn" data-close>Cerrar expediente</button></div></div>'}
if(dialog==='report'){const r=D.reports.find(x=>x.id===chosen);if(!r)return '';const s=student(r.student_id);const fs=fupsFor(r.id);return '<div class="overlay"><div class="modal"><div class="modalheader"><div><small>DETALLE DE REPORTE · '+esc(date(r.report_date))+'</small><h2>'+esc(s?.full_name||'Alumno')+'</h2><span class="muted">'+esc(r.group_code)+' · '+esc(r.subject_snapshot||'Área no indicada')+'</span></div><button class="btn" data-close>✕</button></div>'+severityBadge(r.severity)+'<div class="detail"><b>Motivo</b><p>'+esc(r.reason)+'</p></div><div class="detail"><b>Acuerdos</b><p>'+esc(r.agreements||'No especificados')+'</p></div><div class="detail"><b>Docente</b><p>'+esc(r.teacher_snapshot||'No especificado')+'</p></div><div class="gap"></div><div class="flex" style="justify-content:space-between"><h3 style="margin:0">Seguimiento ('+fs.length+')</h3><button class="btn" data-new-followup="'+esc(r.id)+'">＋ Añadir actuación</button></div><div class="timeline">'+(fs.length?fs.map(f=>'<div class="timeline-item"><b>'+esc(({llamada:'Llamada a familia',firma:'Recepción de firma',citatorio:'Citatorio',medida:'Medida',nota:'Nota'})[f.kind]||f.kind)+'</b> · '+esc(f.status)+'<div class="muted small">'+esc(date(f.action_date))+'</div><div>'+esc(f.detail)+'</div></div>').join(''):'<p class="muted">Sin actuaciones registradas.</p>')+'</div><div class="buttons"><button class="btn primary" data-edit-report="'+esc(r.id)+'">Editar reporte</button><button class="btn" data-close>Cerrar</button></div></div></div>'}
if(dialog==='editReport'){const r=D.reports.find(x=>x.id===chosen);if(!r)return '';return '<div class="overlay"><div class="modal"><div class="modalheader"><h2>Editar reporte</h2><button class="btn" data-close>✕</button></div><form id="edit-report">'+reportFields(r)+'<button class="btn primary" type="submit">Guardar cambios</button></form></div></div>'}
if(dialog==='followup')return '<div class="overlay"><div class="modal"><div class="modalheader"><h2>Agregar seguimiento</h2><button class="btn" data-close>✕</button></div><form id="new-followup"><div class="grid2"><div class="field"><label>Actuación</label><select name="kind" class="input">'+(alertReturnStudent?['citatorio','medida','llamada','firma','nota']:['llamada','firma','citatorio','medida','nota']).map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Estado</label><select name="status" class="input">'+['realizado','pendiente','asignado'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Fecha (si se conoce)</label><input name="action_date" type="date" class="input"></div></div><div class="field"><label>Detalle</label><textarea name="detail" class="input" rows="4" required></textarea></div><button type="submit" class="btn primary">Guardar seguimiento</button></form></div></div>';
if(dialog==='newStudent'||dialog==='editStudent'){const s=dialog==='editStudent'?student(chosen):null;return '<div class="overlay"><div class="modal"><div class="modalheader"><h2>'+(s?'Editar alumno':'Agregar alumno')+'</h2><button class="btn" data-close>✕</button></div><form id="save-student"><div class="field"><label>Nombre completo</label><input class="input" name="full_name" required value="'+esc(s?.full_name||'')+'"></div><div class="grid2"><div class="field"><label>Grupo</label><select name="group_code" class="input">'+['1°A','1°B','1°C','2°A','2°B','2°C','3°A','3°B','3°C'].map(g=>'<option '+((s?.group_code||'1°A')===g?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div class="field"><label>Número de lista</label><input class="input" name="enrollment_no" value="'+esc(s?.enrollment_no||'')+'"></div></div><button class="btn primary" type="submit">Guardar alumno</button></form></div></div>'}
return ''}
function render(){if(!key){app.innerHTML='<div class="login"><div class="login-card"><div class="mark">68</div><h1>Acceso de prueba EST 68</h1><p>Esta plataforma contiene expedientes escolares. Para ingresar, abre el enlace privado de evaluación que se te proporcionó.</p><p class="small muted">No se ha habilitado un acceso público.</p></div></div>';return;}if(!D.students.length&&!status){app.innerHTML='<div class="login"><div class="login-card"><b>EST 68</b><h1>Conectando con la base escolar…</h1></div></div>';return;}const titles={resumen:'Resumen general',reportes:'Seguimiento de reportes',alumnos:'Directorio de alumnos',captura:'Capturar reporte'};app.innerHTML=shell(titles[tab]||'EST 68',tab==='resumen'?summary():tab==='reportes'?reportScreen():tab==='alumnos'?studentScreen():capture());}
function toast(s){msg=s;setTimeout(()=>{msg='';render()},4000)}
function csvExport(){const rs=D.reports.filter(r=>(group==='TODOS'||r.group_code===group)&&(severity==='TODAS'||r.severity===severity)&&norm((student(r.student_id)?.full_name||'')+' '+r.reason+' '+r.subject_snapshot).includes(norm(term)));const head=['Alumno','Grado y grupo','Fecha','Motivo','Acuerdos','Materia','Maestro','Tipo de falta','Seguimiento'];const cells=rs.map(r=>[student(r.student_id)?.full_name||'',r.group_code,r.report_date,r.reason,r.agreements,r.subject_snapshot,r.teacher_snapshot,r.severity,fupsFor(r.id).map(f=>f.kind+': '+f.detail+' ('+f.status+')').join(' | ')]);const safe=x=>{let s=String(x??'');if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const file='\uFEFF'+[head,...cells].map(r=>r.map(safe).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([file],{type:'text/csv;charset=utf-8'}));a.download='EST68_reportes_2026_2027.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
document.addEventListener('click',async e=>{if(e.target.classList?.contains('overlay')){dialog='';render();return;}const t=e.target.closest('button,[data-report],[data-student]');if(!t)return;try{if(t.hasAttribute('data-open-alerts')){dialog='alerts';alertReturnStudent='';render()}else if(t.dataset.alertReview){chosen=t.dataset.alertReview;dialog='verifyAlert';render()}else if(t.dataset.alertAdd){alertReturnStudent=t.dataset.alertAdd;const items=reportsFor(alertReturnStudent);if(!items.length)throw Error('El alumno no tiene reportes.');chosen=items[0].id;dialog='followup';render()}else if(t.dataset.tab){tab=t.dataset.tab;term='';group='TODOS';severity='TODAS';dialog='';render()}else if(t.hasAttribute('data-refresh'))await refresh();else if(t.hasAttribute('data-export'))csvExport();else if(t.hasAttribute('data-print'))window.print();else if(t.dataset.report){chosen=t.dataset.report;dialog='report';render()}else if(t.dataset.student){chosen=t.dataset.student;dialog='student';render()}else if(t.dataset.editReport){chosen=t.dataset.editReport;dialog='editReport';render()}else if(t.dataset.newFollowup){chosen=t.dataset.newFollowup;dialog='followup';render()}else if(t.hasAttribute('data-new-student')){chosen='';dialog='newStudent';render()}else if(t.dataset.editStudent){chosen=t.dataset.editStudent;dialog='editStudent';render()}else if(t.hasAttribute('data-close')){dialog='';render()}}catch(err){status='ERROR: '+err.message;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog='';render();}});
document.addEventListener('input',e=>{if(e.target.dataset.filter==='term'){const p=e.target.selectionStart;term=e.target.value;render();const next=document.querySelector('[data-filter=term]');if(next){next.focus();next.setSelectionRange(p,p)}}});
document.addEventListener('change',e=>{if(e.target.dataset.filter==='group'){group=e.target.value;render()}if(e.target.dataset.filter==='severity'){severity=e.target.value;render()}});
document.addEventListener('submit',async e=>{
 const form=e.target;if(!['new-report','edit-report','new-followup','save-student','verify-alert'].includes(form.id))return;
 e.preventDefault();const b=form.querySelector('button[type=submit]');b.disabled=true;
 try{
  const payload=Object.fromEntries(new FormData(form).entries());
  if(form.id==='verify-alert'){
   if(!form.querySelector('[name=acknowledge]').checked)throw Error('Debes confirmar que verificaste la actuación.');
   const proof=D.followups.find(f=>f.id===payload.supporting_followup_id);
   if(!proof)throw Error('No se encuentra la evidencia seleccionada.');
   const id=chosen;
   await api('verifyAlert',{student_id:id,supporting_followup_id:proof.id,action_kind:proof.kind==='citatorio'?'citatorio':'cambio_actividad',verification_note:payload.verification_note||'',confirmation:'VERIFICAR'});
   await refresh();dialog='alerts';render();toast('Actuación verificada: alerta archivada. Se conserva el historial.');
   return;
  }
  let op='';
  if(form.id==='new-report'){op='saveReport'}
  else if(form.id==='edit-report'){op='saveReport';payload.id=chosen}
  else if(form.id==='new-followup'){op='saveFollowup';payload.report_id=chosen}
  else if(form.id==='save-student'){op='saveStudent';if(dialog==='editStudent')payload.id=chosen}
  const returnId=form.id==='new-followup'?alertReturnStudent:'';
  await api(op,payload);
  dialog='';tab=form.id==='save-student'?'alumnos':'reportes';
  await refresh();
  if(returnId){alertReturnStudent='';chosen=returnId;dialog='verifyAlert';render();toast('Seguimiento registrado. Ahora puedes verificar la actuación.');}
  else toast('Registro guardado correctamente en la base escolar.');
 }catch(err){status='ERROR: '+err.message;render()}
 finally{b.disabled=false}
});
if(!key)render();else refresh();
})();
</script></body></html>
