if(dialog==='student'){const s=student(chosen);if(!s)return '';const rs=reportsFor(s.id);return '<div class="overlay"><div class="modal"><div class="modalheader"><div><small>EXPEDIENTE DE ALUMNO</small><h2>'+esc(s.full_name)+'</h2><span class="muted">'+esc(s.group_code)+' · Lista '+esc(s.enrollment_no||'—')+' · 2026–2027</span></div><button class="btn" data-close>✕</button></div><div class="heading"><h3>Reportes: '+rs.length+'</h3>'+(canManage()?'<button class="btn" data-edit-student="'+esc(s.id)+'">Editar alumno</button>':'')+'</div>'+reportTable(rs)+'<div class="gap"></div><button class="btn primary" data-download-student-pdf="'+esc(s.id)+'">⇩ Descargar expediente PDF</button><button class="btn" data-close>Cerrar expediente</button></div></div>'}
if(dialog==='report'){const r=D.reports.find(x=>x.id===chosen);if(!r)return '';const s=student(r.student_id);const fs=fupsFor(r.id);return '<div class="overlay"><div class="modal"><div class="modalheader"><div><small>DETALLE DE REPORTE · '+esc(date(r.report_date))+'</small><h2>'+esc(s?.full_name||'Alumno')+'</h2><span class="muted">'+esc(r.group_code)+' · '+esc(r.subject_snapshot||'Área no indicada')+'</span></div><button class="btn" data-close>✕</button></div>'+severityBadge(r.severity)+'<div class="detail"><b>Motivo</b><p>'+esc(r.reason)+'</p></div><div class="detail"><b>Acuerdos</b><p>'+esc(r.agreements||'No especificados')+'</p></div><div class="detail"><b>Docente</b><p>'+esc(r.teacher_snapshot||'No especificado')+'</p></div><div class="gap"></div><div class="flex" style="justify-content:space-between"><h3 style="margin:0">Seguimiento ('+fs.length+')</h3><button class="btn" data-new-followup="'+esc(r.id)+'">＋ Añadir actuación</button></div><div class="timeline">'+(fs.length?fs.map(f=>'<div class="timeline-item"><b>'+esc(({llamada:'Llamada a familia',firma:'Recepción de firma',citatorio:'Citatorio',medida:'Medida',nota:'Nota'})[f.kind]||f.kind)+'</b> · '+esc(f.status)+'<div class="muted small">'+esc(date(f.action_date))+'</div><div>'+esc(f.detail)+'</div></div>').join(''):'<p class="muted">Sin actuaciones registradas.</p>')+'</div><div class="buttons">'+(canManage()?'<button class="btn primary" data-edit-report="'+esc(r.id)+'">Editar reporte</button>':'')+'<button class="btn primary" data-download-student-pdf="'+esc(r.student_id)+'">⇩ Expediente PDF</button><button class="btn" data-close>Cerrar</button></div></div></div>'}
if(dialog==='editReport'){const r=D.reports.find(x=>x.id===chosen);if(!r)return '';return '<div class="overlay"><div class="modal"><div class="modalheader"><h2>Editar reporte</h2><button class="btn" data-close>✕</button></div><form id="edit-report">'+reportFields(r)+'<button class="btn primary" type="submit">Guardar cambios</button></form></div></div>'}
if(dialog==='followup')return '<div class="overlay"><div class="modal"><div class="modalheader"><h2>Agregar seguimiento</h2><button class="btn" data-close>✕</button></div><form id="new-followup"><div class="grid2"><div class="field"><label>Actuación</label><select name="kind" class="input">'+(alertReturnStudent?['citatorio','medida','llamada','firma','nota']:['llamada','firma','citatorio','medida','nota']).map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Estado</label><select name="status" class="input">'+(alertReturnStudent?['pendiente','realizado','asignado']:['realizado','pendiente','asignado']).map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Fecha (si se conoce)</label><input name="action_date" type="date" class="input"></div></div><div class="field"><label>Detalle</label><textarea name="detail" class="input" rows="4" required></textarea></div><button type="submit" class="btn primary">Guardar seguimiento</button></form></div></div>';
if(dialog==='newStudent'||dialog==='editStudent'){const s=dialog==='editStudent'?student(chosen):null;return '<div class="overlay"><div class="modal"><div class="modalheader"><h2>'+(s?'Editar alumno':'Agregar alumno')+'</h2><button class="btn" data-close>✕</button></div><form id="save-student"><div class="field"><label>Nombre completo</label><input class="input" name="full_name" required value="'+esc(s?.full_name||'')+'"></div><div class="grid2"><div class="field"><label>Grupo</label><select name="group_code" class="input">'+['1°A','1°B','1°C','2°A','2°B','2°C','3°A','3°B','3°C'].map(g=>'<option '+((s?.group_code||'1°A')===g?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div class="field"><label>Número de lista</label><input class="input" name="enrollment_no" value="'+esc(s?.enrollment_no||'')+'"></div></div><button class="btn primary" type="submit">Guardar alumno</button></form></div></div>'}
return ''}
function render(){
 if(!key&&!staffToken){app.innerHTML='<div class="login"><div class="login-card"><div class="login-logos"><img class="login-tech-logo" src="/est68/assets/emblema-secundaria-tecnica.svg" alt="Emblema de Educación Secundaria Técnica"></div><div class="login-institution">ESCUELA SECUNDARIA TÉCNICA N.º 68<br>JUCHITLÁN, JALISCO</div><h1>Ingreso EST 68</h1><p>Personal autorizado de la escuela.</p>'+(status?'<div class="alert">'+esc(status)+'</div>':'')+'<form id="login-sub"><div class="field"><label>Nombre de usuario</label><input class="input" name="username" autocomplete="username" required placeholder="Ej. administrador, prefectura o Jorge Loza"></div><div class="field"><label>Contraseña</label><input class="input" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Iniciar sesión</button></form></div></div>';return;}
 if(!key&&mustChange){app.innerHTML='<div class="login"><div class="login-card"><div class="login-logos"><img class="login-tech-logo" src="/est68/assets/emblema-secundaria-tecnica.svg" alt="Emblema de Educación Secundaria Técnica"></div><div class="login-institution">ESCUELA SECUNDARIA TÉCNICA N.º 68<br>JUCHITLÁN, JALISCO</div><h1>Crear contraseña personal</h1><p>Por seguridad debes sustituir tu PIN temporal por una contraseña definitiva de 12 o más caracteres con mayúscula, minúscula y número. El PIN no podrá utilizarse para consultar expedientes.</p>'+(status?'<div class="alert">'+esc(status)+'</div>':'')+'<form id="change-sub-password"><div class="field"><label>PIN temporal / contraseña inicial</label><input class="input" type="password" name="currentPassword" autocomplete="current-password" required></div><div class="field"><label>Nueva contraseña</label><input class="input" type="password" name="newPassword" minlength="12" autocomplete="new-password" required></div><div class="field"><label>Repetir nueva contraseña</label><input class="input" type="password" name="confirmPassword" minlength="12" autocomplete="new-password" required></div><button class="btn primary" type="submit">Guardar nueva contraseña</button></form><div class="gap"></div><button type="button" class="btn" data-logout>Salir</button></div></div>';return;}
 if(!D.students.length&&!status){app.innerHTML='<div class="login"><div class="login-card"><div class="login-logos"><img class="login-tech-logo" src="/est68/assets/emblema-secundaria-tecnica.svg" alt="Educación Secundaria Técnica"></div><h1>Conectando con la base escolar…</h1></div></div>';return;}
 const titles={resumen:'Resumen general',reportes:'Seguimiento de reportes',alumnos:'Directorio de alumnos',captura:'Capturar reporte'};
 app.innerHTML=shell(titles[tab]||'EST 68',tab==='resumen'?summary():tab==='reportes'?reportScreen():tab==='alumnos'?studentScreen():canCapture()?capture():reportScreen());
}
function toast(s){msg=s;setTimeout(()=>{msg='';render()},4000)}
function csvExport(){const rs=D.reports.filter(r=>(group==='TODOS'||r.group_code===group)&&(severity==='TODAS'||r.severity===severity)&&norm((student(r.student_id)?.full_name||'')+' '+r.reason+' '+r.subject_snapshot).includes(norm(term)));const head=['Alumno','Grado y grupo','Fecha','Motivo','Acuerdos','Materia','Maestro','Tipo de falta','Seguimiento'];const cells=rs.map(r=>[student(r.student_id)?.full_name||'',r.group_code,r.report_date,r.reason,r.agreements,r.subject_snapshot,r.teacher_snapshot,r.severity,fupsFor(r.id).map(f=>f.kind+': '+f.detail+' ('+f.status+')').join(' | ')]);const safe=x=>{let s=String(x??'');if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const file='\uFEFF'+[head,...cells].map(r=>r.map(safe).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([file],{type:'text/csv;charset=utf-8'}));a.download='EST68_reportes_2026_2027.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
document.addEventListener('click',async e=>{if(e.target.classList?.contains('overlay')){if(dialog==='followup')alertReturnStudent='';dialog='';render();return;}const t=e.target.closest('button,[data-report],[data-student]');if(!t)return;try{
if(t.dataset.downloadStudentPdf){
 const s=student(t.dataset.downloadStudentPdf);
 if(!s)throw Error('No se encontró el alumno seleccionado.');
 if(!window.EST68ExpedientePDF)throw Error('No se ha cargado el generador de expedientes. Recarga la página.');
 await window.EST68ExpedientePDF.download({student:s,reports:D.reports,followups:D.followups});
 return;
}
if(t.dataset.kpi){
 const type=t.dataset.kpi;
 if(type==='alumnos'||type==='reportes'){tab=type;term='';group='TODOS';severity='TODAS';dialog='';}
 else if(type==='actuaciones')dialog='kpiActuaciones';
 else if(type==='pendientes')dialog='kpiPendientes';
 render();return;
}
if(t.dataset.groupReport){
 tab='reportes';group=t.dataset.groupReport;term='';severity='TODAS';dialog='';render();return;
}
if(t.hasAttribute('data-dismiss-sub-alarm')){dialog='';render();return;}
if(t.hasAttribute('data-open-sub-alarm')){if(staffRole==='subdireccion'&&urgentAlerts().length){dialog='subEmergency';render();}return;}
if(t.hasAttribute('data-logout')){
 staffToken='';staffRole='';staffName='';mustChange=false;subAlarmArmed=false;lastUrgentSnapshot=[];
 sessionStorage.removeItem('est68-staff-session');sessionStorage.removeItem('est68-sub-session');sessionStorage.removeItem('est68-test-key');
 location.replace('/est68/');return;
}
if(t.hasAttribute('data-manage-accounts')&&canManage()){const response=await api('accounts');accounts=response.accounts||[];dialog='manageAccounts';render();return;}
if(t.hasAttribute('data-open-alerts')){dialog='alerts';alertReturnStudent='';render()}else if(t.dataset.alertReview){if(!canVerify())throw Error('La verificación corresponde a Administración y Subdirección.');chosen=t.dataset.alertReview;dialog='verifyAlert';render()}else if(t.dataset.alertAdd){alertReturnStudent=t.dataset.alertAdd;const items=reportsFor(alertReturnStudent);if(!items.length)throw Error('El alumno no tiene reportes.');chosen=items[0].id;dialog='followup';render()}else if(t.dataset.tab){if(t.dataset.tab==='captura'&&!canCapture())throw Error('No tienes permisos para capturar reportes.');tab=t.dataset.tab;term='';group='TODOS';severity='TODAS';dialog='';alertReturnStudent='';render()}else if(t.hasAttribute('data-refresh'))await refresh();else if(t.hasAttribute('data-export'))csvExport();else if(t.hasAttribute('data-print'))window.print();else if(t.dataset.report){chosen=t.dataset.report;dialog='report';render()}else if(t.dataset.student){chosen=t.dataset.student;dialog='student';render()}else if(t.dataset.editReport){chosen=t.dataset.editReport;dialog='editReport';render()}else if(t.dataset.newFollowup){alertReturnStudent='';chosen=t.dataset.newFollowup;dialog='followup';render()}else if(t.hasAttribute('data-new-student')){chosen='';dialog='newStudent';render()}else if(t.dataset.editStudent){chosen=t.dataset.editStudent;dialog='editStudent';render()}else if(t.hasAttribute('data-close')){if(dialog==='followup')alertReturnStudent='';dialog='';render()}}catch(err){status='ERROR: '+err.message;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){if(dialog==='followup')alertReturnStudent='';dialog='';render();}});
document.addEventListener('input',e=>{if(e.target.dataset.filter==='term'){const p=e.target.selectionStart;term=e.target.value;render();const next=document.querySelector('[data-filter=term]');if(next){next.focus();next.setSelectionRange(p,p)}}});
document.addEventListener('change',e=>{if(e.target.dataset.filter==='group'){group=e.target.value;render()}if(e.target.dataset.filter==='severity'){severity=e.target.value;render()}});
document.addEventListener('submit',async e=>{
 const form=e.target;if(!['new-report','edit-report','new-followup','save-student','verify-alert','login-sub','change-sub-password','activate-account'].includes(form.id))return;
 e.preventDefault();const b=form.querySelector('button[type=submit]');b.disabled=true;
 try{
  const payload=Object.fromEntries(new FormData(form).entries());
  if(form.id==='login-sub'){
   const out=await api('login',{username:payload.username,password:payload.password});
   staffToken=out.session;staffName=out.name;staffRole=out.role;mustChange=out.mustChange;sessionStorage.setItem('est68-staff-session',staffToken);sessionStorage.removeItem('est68-sub-session');status='';subAlarmArmed=staffRole==='subdireccion';lastUrgentSnapshot=[];
   if(mustChange)render();else await refresh();
   return;
  }
  if(form.id==='change-sub-password'){
   if(payload.newPassword!==payload.confirmPassword)throw Error('Las contraseñas nuevas no coinciden.');
   const out=await api('changePassword',{currentPassword:payload.currentPassword,newPassword:payload.newPassword});
   staffToken=out.session;staffRole=out.role||staffRole;sessionStorage.setItem('est68-staff-session',staffToken);sessionStorage.removeItem('est68-sub-session');mustChange=false;status='';subAlarmArmed=staffRole==='subdireccion';lastUrgentSnapshot=[];await refresh();return;
  }
  if(form.id==='activate-account'){
   if(!canManage())throw Error('Requiere acceso administrativo.');
   await api('activateAccount',{username:payload.username,initialPassword:payload.initialPassword});
   const out=await api('accounts');accounts=out.accounts||[];
   dialog='manageAccounts';render();toast('Cuenta activada y contraseña inicial configurada. El usuario deberá cambiarla al ingresar.');return;
  }
  if(form.id==='verify-alert'){
   if(!form.querySelector('[name=acknowledge]').checked)throw Error('Debes confirmar que verificaste la actuación.');
   const proof=D.followups.find(f=>f.id===payload.supporting_followup_id);
   if(!proof)throw Error('No se encuentra la evidencia seleccionada.');
   const id=chosen;
   await api('verifyAlert',{student_id:id,supporting_followup_id:proof.id,action_kind:proof.kind==='citatorio'?'citatorio':'cambio_actividad',verification_note:payload.verification_note||'',confirmation:'VERIFICAR'});
   await refresh();dialog='alerts';render();toast('Actuación verificada: alerta archivada. Se conserva el historial.');
   return;
  }
  let op='';
  if(form.id==='new-report'){op='saveReport'}
  else if(form.id==='edit-report'){op='saveReport';payload.id=chosen}
  else if(form.id==='new-followup'){op='saveFollowup';payload.report_id=chosen}
  else if(form.id==='save-student'){op='saveStudent';if(dialog==='editStudent')payload.id=chosen}
  const returnId=form.id==='new-followup'?alertReturnStudent:'';
  await api(op,payload);
  dialog='';tab=form.id==='save-student'?'alumnos':'reportes';
  await refresh();
  if(returnId){alertReturnStudent='';chosen=returnId;dialog='verifyAlert';render();toast('Seguimiento registrado. Ahora puedes verificar la actuación.');}
  else toast('Registro guardado correctamente en la base escolar.');
 }catch(err){status='ERROR: '+err.message;render()}
 finally{b.disabled=false}
});
async function start(){if(key){await refresh();return;}if(staffToken){try{const who=await api('sessionInfo');staffName=who.name;staffRole=who.role;mustChange=who.mustChange;if(mustChange)render();else{subAlarmArmed=staffRole==='subdireccion';lastUrgentSnapshot=[];await refresh();}return;}catch{staffToken='';sessionStorage.removeItem('est68-sub-session');sessionStorage.removeItem('est68-staff-session');staffRole='';}}render();}
start();
})();
</script></body></html>
