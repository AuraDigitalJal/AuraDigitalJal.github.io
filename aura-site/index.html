  <style>
:root{
  --primary:#151515;--primary-soft:#2d2b28;--accent:#d2b063;--accent-soft:#ead6aa;
  --bg:#faf7f1;--surface:#fffefb;--text:#151515;--muted:#6f6a62;--border:#e6ded3;
  --hero-gradient:linear-gradient(135deg,#fffefb 0%,#f8f2e8 54%,#ead9b8 100%);
  --cta-gradient:linear-gradient(135deg,#101010 0%,#1d1c1a 62%,#725a2d 145%);
  --button-gradient:linear-gradient(135deg,#111111 0%,#2b2824 100%);
  --heading-font:Georgia,'Times New Roman',serif;--body-font:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;--script-font:'Snell Roundhand','Brush Script MT',cursive;
  --heading-scale:1;--body-scale:1;--radius:24px;--shadow-alpha:.11;
  --container:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body-font);font-size:calc(16px * var(--body-scale));line-height:1.55;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit}
button{color:inherit}
[hidden]{display:none!important}
.container{width:min(var(--container),calc(100% - 40px));margin-inline:auto}
.display{font-family:var(--heading-font);font-weight:500;letter-spacing:-.035em;line-height:.98;margin:0;font-size:calc(clamp(2.15rem,5vw,4.8rem) * var(--heading-scale))}
.kicker{font-size:.72rem;letter-spacing:.19em;font-weight:800;color:var(--accent);margin-bottom:14px}
.kicker.light{color:var(--accent-soft)}
p{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:12px 20px;border-radius:999px;border:1px solid transparent;font-weight:750;cursor:pointer;transition:.2s ease;background:none}
.btn-primary{background:var(--button-gradient);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.btn-ghost{background:rgba(255,255,255,.58);border-color:color-mix(in srgb,var(--primary) 22%,transparent);backdrop-filter:blur(12px)}
.btn:hover{transform:translateY(-1px)}
.wa-dot{font-size:1.08em}

.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--border) 75%,transparent)}
.nav{height:78px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px}
.brand-link{display:flex;align-items:center}.logo{height:58px;width:auto;object-fit:contain;border-radius:14px}
.nav-links{display:flex;align-items:center;justify-content:center;gap:28px;font-size:.86rem}.nav-links a{position:relative}.nav-links a:after{content:"";position:absolute;left:0;right:100%;bottom:-8px;height:1px;background:var(--accent);transition:.2s}.nav-links a:hover:after{right:0}
.nav-cta{min-height:44px;padding:10px 17px}.menu-btn{display:none;border:0;background:transparent;font-size:1.8rem;min-width:44px;min-height:44px}.mobile-menu{display:none}

.hero{background:var(--hero-gradient);overflow:hidden;border-bottom:1px solid var(--border)}
.hero-grid{min-height:655px;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:56px;padding-block:64px}
.hero-copy{max-width:650px}.hero-title{font-size:calc(clamp(3rem,6.3vw,6.2rem) * var(--heading-scale));max-width:760px}.hero-text{font-size:1.12rem;max-width:640px;margin:24px 0}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.benefits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:44px;padding-top:26px;border-top:1px solid color-mix(in srgb,var(--primary) 14%,transparent)}.benefit{display:flex;gap:9px;align-items:center;min-width:0}.benefit span{color:var(--accent);font-size:1.15rem}.benefit strong{font-size:.78rem;line-height:1.25}
.hero-visual{position:relative;min-width:0}.hero-visual:before{content:"";position:absolute;inset:9% 4% -8% 18%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 68%);filter:blur(18px)}.hero-visual img{position:relative;width:100%;aspect-ratio:1.06/1;object-fit:cover;border-radius:calc(var(--radius) + 6px);box-shadow:0 28px 70px rgba(42,31,19,var(--shadow-alpha));border:1px solid rgba(255,255,255,.68)}.hero-caption{position:absolute;right:18px;bottom:18px;background:rgba(255,253,249,.9);backdrop-filter:blur(12px);padding:11px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.75);font-size:.78rem;display:flex;align-items:center;gap:8px}.hero-caption span:first-child{color:var(--accent)}

.section{padding:92px 0}.services-section{background:var(--surface)}.section-heading{margin-bottom:36px}.split-heading{display:grid;grid-template-columns:1.2fr .8fr;gap:60px;align-items:end}.split-heading p{max-width:480px;margin:0 0 4px auto}.section-heading .display{font-size:calc(clamp(2.2rem,4.3vw,4rem) * var(--heading-scale))}
.service-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.service-card{border:1px solid var(--border);background:color-mix(in srgb,var(--surface) 94%,white);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:.2s}.service-card:hover{transform:translateY(-4px);box-shadow:0 18px 46px rgba(35,29,21,.07)}.service-image{aspect-ratio:1.15/1;overflow:hidden;background:#eee}.service-image img{width:100%;height:100%;object-fit:cover;transition:.35s}.service-card:hover .service-image img{transform:scale(1.025)}.service-body{padding:20px;display:flex;flex-direction:column;flex:1}.service-body h3{font-family:var(--heading-font);font-size:1.35rem;font-weight:500;margin:0 0 7px}.service-body p{font-size:.92rem;margin:0 0 18px}.text-link{margin-top:auto;display:inline-flex;gap:8px;font-weight:800;font-size:.88rem;align-items:center}.text-link span{color:var(--accent)}

.invitation-section{background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--accent) 4%,var(--bg)))}.invitation-shell{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border);border-radius:calc(var(--radius) + 12px);padding:42px;box-shadow:0 20px 70px rgba(70,55,35,.04)}.invitation-heading{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}.invitation-heading>div:first-child{max-width:690px}.invitation-heading p{max-width:650px}.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.filter{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:.82rem;min-height:40px}.filter.active{background:var(--primary);color:white;border-color:var(--primary)}
.gallery-stage{position:relative}.invitation-gallery{display:flex;gap:15px;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 1px 8px}.invitation-gallery::-webkit-scrollbar{display:none}.gallery-card{flex:0 0 calc((100% - 60px)/5);min-width:180px;background:transparent;border:0;text-align:left;padding:0;cursor:pointer;scroll-snap-align:start}.gallery-image{aspect-ratio:.68/1;border-radius:calc(var(--radius) - 5px);overflow:hidden;background:#ece7df;border:1px solid var(--border);box-shadow:0 12px 30px rgba(30,20,10,.055)}.gallery-image img{width:100%;height:100%;object-fit:cover;transition:.3s}.gallery-card:hover .gallery-image img{transform:scale(1.03)}.gallery-card-copy{padding:12px 4px 0;display:flex;flex-direction:column;gap:2px}.gallery-card-copy strong{font-family:var(--heading-font);font-weight:500;font-size:1.05rem}.gallery-card-copy span{font-size:.78rem;color:var(--muted)}.gallery-arrow{position:absolute;top:43%;transform:translateY(-50%);z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);box-shadow:0 8px 30px rgba(0,0,0,.09);cursor:pointer;font-size:1.8rem;line-height:1}.gallery-arrow.prev{left:-22px}.gallery-arrow.next{right:-22px}.empty-gallery{width:100%;padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}

   ========================================================= */
.feature-badge,.example-count{display:none!important}

/* Functional controls: editorial, restrained, never decorative pills */
.btn{
  min-height:48px;
  padding:12px 18px;
  border-radius:7px;
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.01em;
  box-shadow:none;
}
.btn-primary{
  background:var(--primary);

  function navItems(){
    const defaults=base.nav?.items||[],current=Array.isArray(data.nav?.items)?data.nav.items:[];
    const map=new Map(current.map((x,i)=>[String(x?.target||''),{...x,_index:i}]));
    const merged=defaults.map(d=>Object.assign({},d,map.get(String(d.target))||{}));
    current.forEach((x,i)=>{if(x?.target&&!merged.some(y=>String(y.target)===String(x.target)))merged.push({...x,_index:i})});
    return merged.filter(x=>x.visible!==false);
  }
  function renderNav(){const items=navItems();const html=items.map(x=>`<a href="#${esc(x.target)}" data-edit-key="nav.items.${Math.max(0,x._index??(data.nav.items||[]).findIndex(y=>y.target===x.target))}.label">${esc(x.label)}</a>`).join('');$('[data-nav-links]').innerHTML=html;$('[data-mobile-menu]').innerHTML=`<div class="mobile-menu-head"><span>MENÚ</span><strong>${esc(data.brand?.name||'Aura Digital')}</strong></div><nav>${html}</nav><a class="btn btn-primary mobile-menu-cta" href="${waUrl()}" target="_blank" rel="noopener" data-edit-key="nav.cta">${esc(data.nav?.cta||'WhatsApp')}</a>`;$('[data-footer-links]').innerHTML=items.slice(1).map(x=>`<a href="#${esc(x.target)}">${esc(x.label)}</a>`).join('');setText('[data-nav-cta]',data.nav?.cta||'Cotiza por WhatsApp','nav.cta');$$('[data-wa]').forEach(a=>a.href=waUrl())}

  function renderHero(){const h=data.hero||{};setVisible($('[data-section="hero"]'),h.visible);setText('[data-hero-eyebrow]',h.eyebrow,'hero.eyebrow');setText('[data-hero-title]',h.title,'hero.title');setText('[data-hero-text]',h.text,'hero.text');setText('[data-hero-primary]',h.primaryButton,'hero.primaryButton');setText('[data-hero-secondary]',h.secondaryButton,'hero.secondaryButton');const img=$('[data-hero-image]');const mobileSource=$('[data-hero-mobile-source]');if(img){img.src=h.image||'';const fx=Number(h.imageFocusX??50),fy=Number(h.imageFocusY??50),mfx=Number(h.mobileImageFocusX??fx),mfy=Number(h.mobileImageFocusY??fy);img.style.objectPosition=`${fx}% ${fy}%`;img.style.setProperty('--hero-focus-x',`${fx}%`);img.style.setProperty('--hero-focus-y',`${fy}%`);img.style.setProperty('--hero-mobile-focus-x',`${mfx}%`);img.style.setProperty('--hero-mobile-focus-y',`${mfy}%`);img.dataset.editKey=window.matchMedia('(max-width: 720px)').matches?'hero.mobileImage':'hero.image';if(mobileSource)mobileSource.srcset=h.mobileImage||h.image||''}const sl=$('[data-hero-secondary-link]');if(sl)sl.href='#'+(h.secondaryTarget||'servicios');const hero=$('[data-section="hero"]');if(hero){hero.dataset.visualStyle=h.visualStyle||'editorial';hero.style.setProperty('--hero-overlay',String(Number(h.overlay)||0))}const box=$('[data-benefits]');box.innerHTML=(data.benefits||[]).filter(x=>x.visible!==false).map(x=>{const i=data.benefits.indexOf(x);return `<div class="benefit" data-edit-key="benefits.${i}.title"><span>${esc(x.icon)}</span><strong>${esc(x.title)}</strong></div>`}).join('')}

  function renderServices(){setText('[data-services-eyebrow]',data.servicesIntro?.eyebrow,'servicesIntro.eyebrow');setText('[data-services-title]',data.servicesIntro?.title,'servicesIntro.title');setText('[data-services-text]',data.servicesIntro?.text,'servicesIntro.text');$('[data-service-grid]').innerHTML=(data.services||[]).filter(x=>x.visible!==false).map(s=>{const i=data.services.indexOf(s);return `<article class="service-card"><a class="service-image" href="#${esc(s.target)}"><img src="${esc(s.image)}" alt="${esc(s.title)}" data-edit-key="services.${i}.image"></a><div class="service-body"><h3 data-edit-key="services.${i}.title">${esc(s.title)}</h3><p data-edit-key="services.${i}.text">${esc(s.text)}</p><a class="text-link" href="#${esc(s.target)}" data-edit-key="services.${i}.button">${esc(s.button)} <span>→</span></a></div></article>`}).join('')}

  function itemCard(x,kind,index,layout,showTitles=true,showSubtitles=true){const path=kind==='invitation'?`invitationGallery.items.${index}`:`features.${kind}.examples.${index}`;const title=showTitles?`<strong data-edit-key="${path}.title">${esc(x.title||'Proyecto')}</strong>`:'';const sub=showSubtitles&&x.subtitle?`<span data-edit-key="${path}.subtitle">${esc(x.subtitle)}</span>`:'';const demo=x.url?`<em class="demo-hint">Ver demo ↗</em>`:'';const ratio=x.cardRatio||(kind==='invitation'?'portrait':'landscape');return `<button type="button" class="gallery-card ratio-${esc(ratio)}" data-gallery-item data-kind="${esc(kind)}" data-id="${esc(x.id||String(index))}"><div class="gallery-image"><img src="${esc(x.image)}" alt="${esc(x.title||'Ejemplo')}" style="object-position:${Number(x.focusX??50)}% ${Number(x.focusY??50)}%" data-edit-key="${path}.image"></div>${title||sub||demo?`<div class="gallery-card-copy">${title}${sub}${demo}</div>`:''}</button>`}
  function renderInvitationGallery(){const g=data.invitationGallery||{};setVisible($('[data-section="invitationGallery"]'),g.visible);setText('[data-gallery-eyebrow]',g.eyebrow,'invitationGallery.eyebrow');setText('[data-gallery-title]',g.title,'invitationGallery.title');setText('[data-gallery-text]',g.text,'invitationGallery.text');let cats=[...(g.categories||[])].filter(Boolean);if(!cats.includes('Todas'))cats.unshift('Todas');if(!cats.includes(currentCategory))currentCategory='Todas';$('[data-gallery-filters]').innerHTML=cats.map(c=>`<button type="button" class="filter ${c===currentCategory?'active':''}" data-category="${esc(c)}">${esc(c)}</button>`).join('');$$('[data-category]').forEach(b=>b.addEventListener('click',()=>{currentCategory=b.dataset.category;renderInvitationGallery()}));const all=g.items||[];const items=all.map((x,i)=>({x,i})).filter(({x})=>x.visible!==false&&(currentCategory==='Todas'||x.category===currentCategory));const grid=$('[data-gallery-grid]');grid.className=`invitation-gallery layout-${g.layout||'editorial'} ratio-${g.cardRatio||'portrait'}`;grid.innerHTML=items.length?items.map(({x,i})=>itemCard(x,'invitation',i,g.layout,g.showTitles!==false,g.showSubtitles!==false)).join(''):`<div class="empty-gallery">Aún no hay ejemplos en esta categoría.</div>`;bindGalleryCards()}

  function renderFeature(key){
    const f=data.features?.[key],mount=$(`[data-feature-section="${key}"]`);if(!mount||!f)return;setVisible(mount,f.visible);if(f.visible===false)return;
    const reverse=mount.classList.contains('alt');
    const examples=(f.examples||[]).map((x,i)=>({x,i})).filter(({x})=>x.visible!==false);
    const examplesHtml=examples.map(({x,i})=>itemCard(x,key,i,f.galleryLayout,f.showTitles!==false,f.showSubtitles!==false)).join('');
    const featureLink=f.button?`<a class="feature-link" href="#${key}-examples" data-edit-key="features.${key}.button"><span>${esc(f.button)}</span><i aria-hidden="true">↓</i></a>`:'';
    const examplesSection=examples.length?`<div class="feature-examples" id="${key}-examples">
        <div class="feature-examples-head"><div><span class="kicker">PROYECTOS</span><h3 data-edit-key="features.${key}.examplesTitle">${esc(f.examplesTitle||'Ejemplos')}</h3></div></div>
        <div class="feature-gallery layout-${f.galleryLayout||'editorial'}" data-inline-gallery="${key}">${examplesHtml}</div>
      </div>`:'';
    mount.innerHTML=`<div class="container feature-block">
      <div class="feature ${reverse?'reverse':''}">
        <div class="feature-copy"><div class="kicker" data-edit-key="features.${key}.eyebrow">${esc(f.eyebrow)}</div><h2 class="display" data-edit-key="features.${key}.title">${esc(f.title)}</h2><p data-edit-key="features.${key}.text">${esc(f.text)}</p><div class="point-grid">${(f.points||[]).map((p,i)=>`<div data-edit-key="features.${key}.points"><span>✦</span>${esc(p)}</div>`).join('')}</div>${featureLink}</div>
        <div class="feature-image"><img src="${esc(f.image)}" alt="${esc(f.title)}" data-edit-key="features.${key}.image"></div>
      </div>
      ${examplesSection}
    </div>`;
    bindGalleryCards();
  }

  function renderWhy(){setVisible($('[data-section="why"]'),data.why?.visible);setText('[data-why-eyebrow]',data.why?.eyebrow,'why.eyebrow');setText('[data-why-title]',data.why?.title,'why.title');$('[data-why-grid]').innerHTML=(data.why?.items||[]).filter(x=>x.visible!==false).map(x=>{const i=data.why.items.indexOf(x);return `<article class="why-card"><span class="why-icon">${esc(x.icon||'✦')}</span><h3 data-edit-key="why.items.${i}.title">${esc(x.title)}</h3><p data-edit-key="why.items.${i}.text">${esc(x.text)}</p></article>`}).join('')}
  function renderProcess(){setVisible($('[data-section="process"]'),data.process?.visible);setText('[data-process-eyebrow]',data.process?.eyebrow,'process.eyebrow');setText('[data-process-title]',data.process?.title,'process.title');$('[data-process-grid]').innerHTML=(data.process?.items||[]).map((x,i)=>`<article class="process-item"><span>${esc(x.number)}</span><div><h3 data-edit-key="process.items.${i}.title">${esc(x.title)}</h3><p data-edit-key="process.items.${i}.text">${esc(x.text)}</p></div></article>`).join('')}
  function renderCtaFooter(){setVisible($('[data-section="cta"]'),data.cta?.visible);setText('[data-cta-eyebrow]',data.cta?.eyebrow,'cta.eyebrow');setText('[data-cta-title]',data.cta?.title,'cta.title');setText('[data-cta-text]',data.cta?.text,'cta.text');setText('[data-cta-button]',data.cta?.button,'cta.button');setText('[data-footer-note]',data.footer?.note,'footer.note');setText('[data-footer-tagline]',data.footer?.tagline,'footer.tagline');const socials=[];if(data.contact?.instagram&&data.contact.instagram!=='#')socials.push(`<a href="${esc(data.contact.instagram)}" target="_blank" rel="noopener">Instagram</a>`);if(data.contact?.facebook&&data.contact.facebook!=='#')socials.push(`<a href="${esc(data.contact.facebook)}" target="_blank" rel="noopener">Facebook</a>`);if(data.contact?.tiktok&&data.contact.tiktok!=='#')socials.push(`<a href="${esc(data.contact.tiktok)}" target="_blank" rel="noopener">TikTok</a>`);$('[data-social-links]').innerHTML=socials.join('')}

  function applySectionOrder(){const order=data.layout?.sectionOrder||[];const main=$('main');if(!main)return;main.style.display='flex';main.style.flexDirection='column';const visible=k=>{if(k==='hero')return data.hero?.visible!==false;if(k==='invitationGallery')return data.invitationGallery?.visible!==false;if(['menus','web','galleries'].includes(k))return data.features?.[k]?.visible!==false;if(k==='why')return data.why?.visible!==false;if(k==='process')return data.process?.visible!==false;if(k==='cta')return data.cta?.visible!==false;return data.layout?.sectionVisibility?.[k]!==false};order.forEach((k,i)=>{const el=$(`[data-section-key="${k}"]`);if(el){el.style.order=i+1;el.hidden=!visible(k)}})}

  function openExamples(key){const f=data.features[key],modal=$('[data-modal]');modal.dataset.variant=key;modal.dataset.layout=f.galleryLayout||'editorial';setText('[data-modal-title]',f.examplesTitle||f.title);const items=(f.examples||[]).map((x,i)=>({x,i})).filter(({x})=>x.visible!==false);const mg=$('[data-modal-grid]');mg.className=`modal-grid layout-${f.galleryLayout||'editorial'}`;mg.innerHTML=items.length?items.map(({x,i})=>itemCard(x,key,i,f.galleryLayout,f.showTitles!==false,f.showSubtitles!==false)).join(''):`<div class="empty-gallery">Aún no hay ejemplos publicados.</div>`;modal.hidden=false;document.body.classList.add('modal-open');bindGalleryCards()}
  function closeModal(){const m=$('[data-modal]');if(m){m.hidden=true;document.body.classList.remove('modal-open')}}
  function findItem(kind,id){if(kind==='invitation')return (data.invitationGallery.items||[]).find(x=>String(x.id)===String(id));return (data.features?.[kind]?.examples||[]).find(x=>String(x.id)===String(id))}
  function visibleItemsFor(kind){if(kind==='invitation')return (data.invitationGallery.items||[]).filter(x=>x.visible!==false&&(currentCategory==='Todas'||x.category===currentCategory));return (data.features?.[kind]?.examples||[]).filter(x=>x.visible!==false)}
  function bindGalleryCards(){$$('[data-gallery-item]').forEach(b=>{if(b.dataset.galleryBound==='1')return;b.dataset.galleryBound='1';b.addEventListener('click',e=>{if(previewMode&&editMode)return;const item=findItem(b.dataset.kind,b.dataset.id);if(item)openLightbox(item,b.dataset.kind)})})}
  function renderLightboxItem(){
    const item=lightboxItems[lightboxIndex];if(!item)return;
    const img=$('[data-lightbox-image]');img.classList.remove('portrait','landscape');img.src=item.lightboxImage||item.image||'';img.alt=item.title||'Vista ampliada';img.onload=()=>img.classList.add(img.naturalHeight>img.naturalWidth?'portrait':'landscape');
    setText('[data-lightbox-title]',item.title);setText('[data-lightbox-subtitle]',item.subtitle||'');setText('[data-lightbox-count]',`${lightboxIndex+1} / ${lightboxItems.length}`);
    const link=$('[data-lightbox-link]');if(item.url){link.href=item.url;link.hidden=false}else link.hidden=true;
    $('[data-lightbox-prev]').disabled=lightboxItems.length<2;$('[data-lightbox-next]').disabled=lightboxItems.length<2;
  }
  function openLightbox(item,kind){const l=$('[data-lightbox]');lightboxKind=kind;lightboxItems=visibleItemsFor(kind);lightboxIndex=Math.max(0,lightboxItems.findIndex(x=>String(x.id)===String(item.id)));renderLightboxItem();l.hidden=false;document.body.classList.add('modal-open')}
  function stepLightbox(dir){if(lightboxItems.length<2)return;lightboxIndex=(lightboxIndex+dir+lightboxItems.length)%lightboxItems.length;renderLightboxItem()}
  function closeLightbox(){const l=$('[data-lightbox]');if(l){l.hidden=true;document.body.classList.remove('modal-open')}}
  function scrollGallery(dir){const g=$('[data-gallery-grid]');g.scrollBy({left:dir*Math.max(280,g.clientWidth*.72),behavior:'smooth'})}

  function bindShell(){const mb=$('.menu-btn'),mm=$('[data-mobile-menu]');mb.addEventListener('click',()=>{const on=mm.classList.toggle('open');document.body.classList.toggle('menu-open',on);mb.setAttribute('aria-expanded',String(on));mb.textContent=on?'×':'☰'});mm.addEventListener('click',e=>{if(e.target.closest('a')){mm.classList.remove('open');document.body.classList.remove('menu-open');mb.setAttribute('aria-expanded','false');mb.textContent='☰'}});$$('[data-modal-close]').forEach(x=>x.addEventListener('click',closeModal));$$('[data-lightbox-close]').forEach(x=>x.addEventListener('click',closeLightbox));$('[data-lightbox-prev]').addEventListener('click',()=>stepLightbox(-1));$('[data-lightbox-next]').addEventListener('click',()=>stepLightbox(1));$('[data-gallery-prev]').addEventListener('click',()=>scrollGallery(-1));$('[data-gallery-next]').addEventListener('click',()=>scrollGallery(1));let swipeX=0;const lb=$('[data-lightbox]');lb.addEventListener('pointerdown',e=>{swipeX=e.clientX});lb.addEventListener('pointerup',e=>{const dx=e.clientX-swipeX;if(Math.abs(dx)>55)stepLightbox(dx<0?1:-1)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLightbox();closeModal()}if(!$('[data-lightbox]').hidden&&e.key==='ArrowLeft')stepLightbox(-1);if(!$('[data-lightbox]').hidden&&e.key==='ArrowRight')stepLightbox(1)})}

  function highlightPath(path){
    $$('.preview-active').forEach(el=>el.classList.remove('preview-active'));
    if(!path)return;let targets=[];try{targets=$$(`[data-edit-key="${CSS.escape(path)}"]`)}catch(e){}
    if(!targets.length&&path.includes('.points')){try{targets=$$(`[data-edit-key="${CSS.escape(path)}"]`)}catch(e){}}
    const first=targets[0];targets.forEach(el=>el.classList.add('preview-active'));if(first&&previewMode){first.scrollIntoView({behavior:'smooth',block:'center'})}
  }
  function bindPreviewEditing(){if(!previewMode)return;document.addEventListener('click',e=>{if(!editMode)return;const target=e.target.closest('[data-edit-key]');if(!target)return;e.preventDefault();e.stopPropagation();parent.postMessage({type:'AURA_EDIT_REQUEST',path:target.dataset.editKey},'*')},true)}
  function setEditMode(on){editMode=Boolean(on);document.documentElement.classList.toggle('preview-edit-mode',editMode);document.body.classList.toggle('preview-edit-mode',editMode)}

  function apply(){window.CURRENT_AURA_DATA=data;applyMeta();applyTheme();renderNav();renderHero();renderServices();renderInvitationGallery();renderFeature('menus');renderFeature('web');renderFeature('galleries');renderWhy();renderProcess();renderCtaFooter();applySectionOrder();setEditMode(editMode)}
  window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='AURA_PREVIEW_STATE'&&m.state){data=deepMerge(structuredClone(base),m.state);setEditMode(Boolean(m.editMode));apply();if(m.highlightPath)highlightPath(m.highlightPath)}else if(m.type==='AURA_HIGHLIGHT_PATH'){highlightPath(m.path)}});
  bindShell();bindPreviewEditing();apply();
})();

</script>
</body>
</html>
